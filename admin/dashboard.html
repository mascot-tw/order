<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理後台 — 國際柑仔店訂購系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');
  :root{
    --brand:#C85C2A;--brand-lt:#F5EDE6;--brand-dk:#8C3D18;
    --ink:#1A1410;--ink-2:#5A4A3A;--ink-3:#9A8A7A;
    --surface:#FDFAF7;--surface-2:#F5EDE6;--line:#E8DDD4;--white:#FFFFFF;
    --success:#2E7D52;--success-lt:#EAF5EE;
    --warning:#B45309;--warning-lt:#FEF3C7;
    --danger:#C0392B;--danger-lt:#FEF2F2;
    --radius:10px;--nav-h:60px;--side-w:220px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh;display:flex}

  /* SIDEBAR */
  .sidebar{width:var(--side-w);background:var(--ink);min-height:100vh;flex-shrink:0;display:flex;flex-direction:column}
  .sb-brand{padding:20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sb-logo{width:32px;height:32px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .sb-name{font-family:'Noto Serif TC',serif;font-size:14px;color:var(--white);letter-spacing:.04em;line-height:1.4}
  .sb-sub{font-size:10px;color:var(--ink-3);letter-spacing:.06em}
  .sb-admin{margin:14px 12px 6px;font-size:10px;color:var(--ink-3);letter-spacing:.08em;padding:0 6px}
  .sb-item{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:8px;margin:2px 8px;font-size:13px;color:var(--ink-3);cursor:pointer;transition:all .15s;text-decoration:none}
  .sb-item:hover{background:rgba(255,255,255,.07);color:var(--white)}
  .sb-item.active{background:rgba(200,92,42,.2);color:var(--brand)}
  .sb-item svg{flex-shrink:0}
  .sb-foot{margin-top:auto;padding:16px 12px;border-top:1px solid rgba(255,255,255,.08)}
  .btn-logout-sb{width:100%;padding:9px;background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:var(--ink-3);font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .2s}
  .btn-logout-sb:hover{border-color:rgba(255,255,255,.4);color:var(--white)}

  /* MAIN */
  .main{flex:1;overflow-x:hidden}
  .topbar{height:var(--nav-h);background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .topbar-title{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:600}
  .topbar-right{font-size:13px;color:var(--ink-3)}
  .topbar-right span{color:var(--ink);font-weight:500}

  .content{padding:24px}

  /* 統計卡 */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
  .stat-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 20px}
  .stat-label{font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:8px}
  .stat-value{font-size:26px;font-weight:500;color:var(--ink)}
  .stat-sub{font-size:11px;color:var(--ink-3);margin-top:4px}

  /* 分頁標籤 */
  .tab-bar{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:0}
  .tab{padding:10px 18px;font-size:13px;font-family:'Noto Sans TC',sans-serif;background:transparent;border:none;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}
  .tab:hover:not(.active){color:var(--ink-2)}

  /* 表格 */
  .table-wrap{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .table-toolbar{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .search-input{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:13px;font-family:'Noto Sans TC',sans-serif;width:200px;outline:none;color:var(--ink)}
  .search-input:focus{border-color:var(--brand)}
  .btn-add{height:36px;padding:0 16px;background:var(--brand);color:var(--white);border:none;border-radius:8px;font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
  .btn-add:hover{background:var(--brand-dk)}
  .btn-refresh{height:36px;padding:0 14px;background:transparent;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;color:var(--ink-2);transition:all .15s;display:flex;align-items:center;gap:6px}
  .btn-refresh:hover{border-color:var(--brand);color:var(--brand)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:10px 14px;font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;background:var(--surface);border-bottom:1px solid var(--line)}
  td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--surface)}

  /* 狀態 pill */
  .pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
  .pill-ok{background:var(--success-lt);color:var(--success)}
  .pill-warn{background:var(--warning-lt);color:var(--warning)}
  .pill-off{background:var(--danger-lt);color:var(--danger)}
  .pill-admin{background:#EEEDFE;color:#3C3489}

  /* 操作按鈕 */
  .btn-sm{padding:5px 12px;border-radius:6px;font-size:12px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink-2);transition:all .15s}
  .btn-sm:hover{border-color:var(--brand);color:var(--brand)}
  .btn-sm-danger:hover{border-color:var(--danger);color:var(--danger)}

  /* Modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(26,20,16,.45);z-index:200;align-items:center;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:var(--white);border-radius:14px;width:100%;max-width:480px;margin:16px;overflow:hidden}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:600}
  .modal-close{width:28px;height:28px;background:var(--surface);border:none;border-radius:6px;cursor:pointer;font-size:16px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

  .fg{display:flex;flex-direction:column;gap:5px}
  .fg label{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.05em}
  .fg input,.fg select{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);outline:none;transition:border-color .2s}
  .fg input:focus,.fg select:focus{border-color:var(--brand)}
  .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fg .hint{font-size:11px;color:var(--ink-3)}

  .btn-primary{padding:9px 20px;background:var(--brand);color:var(--white);border:none;border-radius:8px;font-size:14px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:background .2s}
  .btn-primary:hover{background:var(--brand-dk)}
  .btn-cancel{padding:9px 20px;background:transparent;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;color:var(--ink-2)}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--white);padding:11px 20px;border-radius:24px;font-size:13px;z-index:999;transition:transform .3s;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* loading */
  .loading-row td{text-align:center;padding:32px;color:var(--ink-3);font-size:13px}

  @media(max-width:768px){
    .sidebar{display:none}
    .stat-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-logo">🍊</div>
    <div>
      <div class="sb-name">國際柑仔店</div>
      <div class="sb-sub">ADMIN PORTAL</div>
    </div>
  </div>

  <div class="sb-admin">管理功能</div>
  <a class="sb-item active" id="nav-orders" onclick="showTab('orders')">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2" width="12" height="12" rx="2"/><line x1="5" y1="6" x2="11" y2="6"/><line x1="5" y1="9" x2="9" y2="9"/></svg>
    訂單管理
  </a>
  <a class="sb-item" id="nav-dealers" onclick="showTab('dealers')">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3 2.7-5 6-5s6 2 6 5"/></svg>
    帳號管理
  </a>

  <div class="sb-foot">
    <div style="font-size:12px;color:var(--ink-3);padding:0 6px;margin-bottom:10px">
      登入中：<span id="adminName" style="color:var(--white)"></span>
    </div>
    <button class="btn-logout-sb" onclick="logout()">登出</button>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="pageTitle">訂單管理</span>
    <span class="topbar-right" id="lastUpdate"></span>
  </div>

  <div class="content">
    <!-- 統計卡 -->
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">今日訂單</div><div class="stat-value" id="s-today">—</div></div>
      <div class="stat-card"><div class="stat-label">待確認</div><div class="stat-value" id="s-pending">—</div></div>
      <div class="stat-card"><div class="stat-label">本月總金額</div><div class="stat-value" id="s-revenue">—</div><div class="stat-sub">NT$</div></div>
      <div class="stat-card"><div class="stat-label">啟用帳號</div><div class="stat-value" id="s-dealers">—</div></div>
    </div>

    <!-- 分頁 -->
    <div class="tab-bar">
      <button class="tab active" id="tab-orders"  onclick="showTab('orders')">訂單列表</button>
      <button class="tab"        id="tab-dealers" onclick="showTab('dealers')">經銷商帳號</button>
    </div>

    <!-- 訂單表格 -->
    <div id="panel-orders">
      <div class="table-wrap">
        <div class="table-toolbar">
          <input class="search-input" type="text" placeholder="搜尋訂單編號 / 帳號..." id="orderSearch" oninput="filterOrders()">
          <select id="statusFilter" style="height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);outline:none" onchange="filterOrders()">
            <option value="">全部狀態</option>
            <option>待確認</option><option>已確認</option><option>備貨中</option><option>已出貨</option><option>已完成</option><option>已取消</option>
          </select>
          <button class="btn-refresh" onclick="loadOrders()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 7A6 6 0 107 1" stroke-linecap="round"/><polyline points="1 1 1 7 7 7" fill="none"/></svg>
            重新整理
          </button>
        </div>
        <table><thead><tr>
          <th>訂單編號</th><th>經銷商</th><th>下單時間</th><th>收件人</th><th>金額</th><th>狀態</th><th>操作</th>
        </tr></thead>
        <tbody id="ordersTbody"><tr class="loading-row"><td colspan="7">載入中...</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- 帳號表格 -->
    <div id="panel-dealers" style="display:none">
      <div class="table-wrap">
        <div class="table-toolbar">
          <input class="search-input" type="text" placeholder="搜尋帳號 / 公司名稱..." id="dealerSearch" oninput="filterDealers()">
          <button class="btn-add" onclick="openDealerModal()">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="6.5" y1="1" x2="6.5" y2="12"/><line x1="1" y1="6.5" x2="12" y2="6.5"/></svg>
            新增帳號
          </button>
          <button class="btn-refresh" onclick="loadDealers()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 7A6 6 0 107 1" stroke-linecap="round"/><polyline points="1 1 1 7 7 7" fill="none"/></svg>
            重新整理
          </button>
        </div>
        <table><thead><tr>
          <th>帳號</th><th>公司名稱</th><th>聯絡人</th><th>電話</th><th>角色</th><th>狀態</th><th>操作</th>
        </tr></thead>
        <tbody id="dealersTbody"><tr class="loading-row"><td colspan="7">載入中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 帳號 Modal -->
<div class="modal-bg" id="dealerModal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modalTitle">新增經銷商帳號</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg-row">
        <div class="fg">
          <label>帳號<span style="color:var(--brand)">*</span></label>
          <input type="text" id="m-account" placeholder="登入帳號">
        </div>
        <div class="fg">
          <label>密碼</label>
          <input type="text" id="m-password" placeholder="留空則不修改">
          <span class="hint" id="m-pwd-hint">新增時必填</span>
        </div>
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>公司名稱<span style="color:var(--brand)">*</span></label>
          <input type="text" id="m-name" placeholder="公司或商行名稱">
        </div>
        <div class="fg">
          <label>聯絡人</label>
          <input type="text" id="m-contact" placeholder="姓名">
        </div>
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>電話</label>
          <input type="text" id="m-phone" placeholder="09xxxxxxxx">
        </div>
        <div class="fg">
          <label>Email</label>
          <input type="text" id="m-email" placeholder="example@mail.com">
        </div>
      </div>
      <div class="fg-row">
        <div class="fg">
          <label>角色</label>
          <select id="m-role">
            <option value="dealer">dealer（經銷商）</option>
            <option value="admin">admin（管理員）</option>
          </select>
        </div>
        <div class="fg">
          <label>狀態</label>
          <select id="m-status">
            <option value="啟用">啟用</option>
            <option value="停用">停用</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label>備註</label>
        <input type="text" id="m-note" placeholder="（選填）">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-primary" id="modalSaveBtn" onclick="saveDealer()">儲存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzbrEhEC44y6mA-ThVDklFrvZs_HlagR4si8UgE7MRWtE_1GXSTU0Q-QiI7GxcFO4SfmA/exec';

let admin = null;
let allOrders  = [];
let allDealers = [];
let editingAccount = null;

window.addEventListener('DOMContentLoaded', () => {
  admin = JSON.parse(sessionStorage.getItem('admin') || 'null');
  if (!admin) { window.location.href = 'index.html'; return; }
  document.getElementById('adminName').textContent = admin.name || admin.account;
  loadOrders();
  loadDealers();
});

function logout() {
  sessionStorage.removeItem('admin');
  window.location.href = 'index.html';
}

// ── 分頁切換 ──
function showTab(tab) {
  ['orders','dealers'].forEach(t => {
    document.getElementById('panel-' + t).style.display = t === tab ? 'block' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('nav-' + t).classList.toggle('active', t === tab);
  });
  document.getElementById('pageTitle').textContent = tab === 'orders' ? '訂單管理' : '帳號管理';
}

// ── 統計更新 ──
function updateStats() {
  const today = new Date().toISOString().slice(0,10);
  const todayOrders = allOrders.filter(o => o.createdAt.startsWith(today));
  const pending     = allOrders.filter(o => o.status === '待確認');
  const thisMonth   = new Date().toISOString().slice(0,7);
  const revenue     = allOrders.filter(o => o.createdAt.startsWith(thisMonth)).reduce((s,o) => s + o.totalAmt, 0);
  const activeDeals = allDealers.filter(d => d.status === '啟用' && d.role !== 'admin');

  document.getElementById('s-today').textContent   = todayOrders.length;
  document.getElementById('s-pending').textContent = pending.length;
  document.getElementById('s-revenue').textContent = revenue.toLocaleString();
  document.getElementById('s-dealers').textContent = activeDeals.length;
  document.getElementById('lastUpdate').textContent = '更新：' + new Date().toLocaleTimeString('zh-TW');
}

// ── 訂單 ──
async function loadOrders() {
  document.getElementById('ordersTbody').innerHTML = '<tr class="loading-row"><td colspan="7">載入中...</td></tr>';
  try {
    const url  = GAS_URL + '?action=getOrders&token=' + encodeURIComponent(admin.token);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      allOrders = data.orders;
      updateStats();
      renderOrders(allOrders);
    } else {
      document.getElementById('ordersTbody').innerHTML = '<tr class="loading-row"><td colspan="7">' + data.message + '</td></tr>';
    }
  } catch(e) {
    document.getElementById('ordersTbody').innerHTML = '<tr class="loading-row"><td colspan="7">載入失敗</td></tr>';
  }
}

function filterOrders() {
  const q      = document.getElementById('orderSearch').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  let list = allOrders.filter(o =>
    (!q || o.orderId.toLowerCase().includes(q) || o.account.toLowerCase().includes(q) || o.recipient.toLowerCase().includes(q)) &&
    (!status || o.status === status)
  );
  renderOrders(list);
}

function statusPill(s) {
  const map = {'待確認':'pill-warn','已確認':'pill-ok','備貨中':'pill-ok','已出貨':'pill-ok','已完成':'pill-ok','已取消':'pill-off'};
  return `<span class="pill ${map[s]||'pill-warn'}">${s}</span>`;
}

function renderOrders(list) {
  if (!list.length) {
    document.getElementById('ordersTbody').innerHTML = '<tr class="loading-row"><td colspan="7">沒有符合的訂單</td></tr>';
    return;
  }
  document.getElementById('ordersTbody').innerHTML = list.map(o => `
    <tr>
      <td style="font-family:monospace;font-size:12px">${o.orderId}</td>
      <td>${o.account}</td>
      <td style="font-size:12px;color:var(--ink-3)">${o.createdAt.replace('T',' ').slice(0,16)}</td>
      <td>${o.recipient}<br><span style="font-size:11px;color:var(--ink-3)">${o.phone}</span></td>
      <td style="font-weight:500">NT$${o.totalAmt.toLocaleString()}</td>
      <td>${statusPill(o.status)}</td>
      <td>
        <select style="font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);outline:none" onchange="updateStatus('${o.orderId}',this.value)">
          ${['待確認','已確認','備貨中','已出貨','已完成','已取消'].map(s => `<option${s===o.status?' selected':''}>${s}</option>`).join('')}
        </select>
      </td>
    </tr>`).join('');
}

async function updateStatus(orderId, status) {
  try {
    const url  = GAS_URL + '?action=updateOrderStatus&token=' + encodeURIComponent(admin.token) + '&orderId=' + encodeURIComponent(orderId) + '&status=' + encodeURIComponent(status);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      const o = allOrders.find(x => x.orderId === orderId);
      if (o) o.status = status;
      updateStats();
      showToast('訂單 ' + orderId + ' 已更新為「' + status + '」');
    } else {
      showToast('更新失敗：' + data.message);
    }
  } catch(e) { showToast('連線失敗'); }
}

// ── 帳號 ──
async function loadDealers() {
  document.getElementById('dealersTbody').innerHTML = '<tr class="loading-row"><td colspan="7">載入中...</td></tr>';
  try {
    const url  = GAS_URL + '?action=getDealers&token=' + encodeURIComponent(admin.token);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      allDealers = data.dealers;
      updateStats();
      renderDealers(allDealers);
    }
  } catch(e) {
    document.getElementById('dealersTbody').innerHTML = '<tr class="loading-row"><td colspan="7">載入失敗</td></tr>';
  }
}

function filterDealers() {
  const q = document.getElementById('dealerSearch').value.toLowerCase();
  renderDealers(allDealers.filter(d => !q || d.account.includes(q) || d.name.includes(q) || d.contact.includes(q)));
}

function renderDealers(list) {
  if (!list.length) {
    document.getElementById('dealersTbody').innerHTML = '<tr class="loading-row"><td colspan="7">沒有帳號資料</td></tr>';
    return;
  }
  document.getElementById('dealersTbody').innerHTML = list.map(d => `
    <tr>
      <td style="font-family:monospace">${d.account}</td>
      <td style="font-weight:500">${d.name}</td>
      <td>${d.contact}</td>
      <td style="font-size:12px;color:var(--ink-3)">${d.phone}</td>
      <td>${d.role==='admin'?'<span class="pill pill-admin">admin</span>':'<span style="font-size:12px;color:var(--ink-3)">dealer</span>'}</td>
      <td>${d.status==='啟用'?'<span class="pill pill-ok">啟用</span>':'<span class="pill pill-off">停用</span>'}</td>
      <td style="display:flex;gap:6px">
        <button class="btn-sm" onclick="openDealerModal('${d.account}')">編輯</button>
        <button class="btn-sm btn-sm-danger" onclick="toggleDealer('${d.account}','${d.status}')">${d.status==='啟用'?'停用':'啟用'}</button>
      </td>
    </tr>`).join('');
}

// ── Modal ──
function openDealerModal(account) {
  editingAccount = account || null;
  document.getElementById('modalTitle').textContent = account ? '編輯帳號' : '新增經銷商帳號';
  document.getElementById('m-pwd-hint').textContent = account ? '留空則不修改密碼' : '新增時必填';

  if (account) {
    const d = allDealers.find(x => x.account === account);
    if (d) {
      document.getElementById('m-account').value  = d.account;
      document.getElementById('m-account').disabled = true;
      document.getElementById('m-password').value = '';
      document.getElementById('m-name').value     = d.name;
      document.getElementById('m-contact').value  = d.contact;
      document.getElementById('m-phone').value    = d.phone;
      document.getElementById('m-email').value    = d.email;
      document.getElementById('m-role').value     = d.role || 'dealer';
      document.getElementById('m-status').value   = d.status || '啟用';
      document.getElementById('m-note').value     = d.note;
    }
  } else {
    ['m-account','m-password','m-name','m-contact','m-phone','m-email','m-note'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('m-account').disabled = false;
    document.getElementById('m-role').value   = 'dealer';
    document.getElementById('m-status').value = '啟用';
  }
  document.getElementById('dealerModal').classList.add('open');
}

function closeModal() {
  document.getElementById('dealerModal').classList.remove('open');
  editingAccount = null;
}

async function saveDealer() {
  const account  = editingAccount || document.getElementById('m-account').value.trim();
  const password = document.getElementById('m-password').value.trim();
  const name     = document.getElementById('m-name').value.trim();

  if (!account) { showToast('請填寫帳號'); return; }
  if (!name)    { showToast('請填寫公司名稱'); return; }
  if (!editingAccount && !password) { showToast('新增帳號時密碼不可空白'); return; }

  const data = {
    account,
    password,
    name,
    contact : document.getElementById('m-contact').value.trim(),
    phone   : document.getElementById('m-phone').value.trim(),
    email   : document.getElementById('m-email').value.trim(),
    role    : document.getElementById('m-role').value,
    status  : document.getElementById('m-status').value,
    note    : document.getElementById('m-note').value.trim(),
  };

  const btn = document.getElementById('modalSaveBtn');
  btn.disabled = true; btn.textContent = '儲存中...';

  try {
    const url = GAS_URL + '?action=saveDealer&token=' + encodeURIComponent(admin.token) + '&data=' + encodeURIComponent(JSON.stringify(data));
    const res  = await fetch(url);
    const resp = await res.json();
    if (resp.success) {
      showToast(resp.action === 'created' ? '帳號已新增：' + account : '帳號已更新：' + account);
      closeModal();
      loadDealers();
    } else {
      showToast('儲存失敗：' + resp.message);
    }
  } catch(e) {
    showToast('連線失敗');
  } finally {
    btn.disabled = false; btn.textContent = '儲存';
  }
}

async function toggleDealer(account, currentStatus) {
  const newStatus = currentStatus === '啟用' ? '停用' : '啟用';
  const d = allDealers.find(x => x.account === account);
  if (!d) return;
  const data = { ...d, status: newStatus, password: '' };
  try {
    const url  = GAS_URL + '?action=saveDealer&token=' + encodeURIComponent(admin.token) + '&data=' + encodeURIComponent(JSON.stringify(data));
    const res  = await fetch(url);
    const resp = await res.json();
    if (resp.success) { showToast(account + ' 已' + newStatus); loadDealers(); }
    else showToast('更新失敗：' + resp.message);
  } catch(e) { showToast('連線失敗'); }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
