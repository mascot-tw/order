<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理員登入 — 國際柑仔店訂購系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');
  :root{
    --brand:#C85C2A;--brand-lt:#F5EDE6;--brand-dk:#8C3D18;
    --ink:#1A1410;--ink-2:#5A4A3A;--ink-3:#9A8A7A;
    --surface:#FDFAF7;--line:#E8DDD4;--white:#FFFFFF;
    --danger:#C0392B;--radius:10px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--ink);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center}

  .wrap{width:100%;max-width:400px;padding:40px 24px}

  .logo-area{text-align:center;margin-bottom:36px}
  .logo-mark{width:56px;height:56px;background:var(--brand);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px}
  .logo-title{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:600;color:var(--white);letter-spacing:.04em}
  .logo-sub{font-size:12px;color:var(--ink-3);margin-top:4px;letter-spacing:.08em}

  .admin-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,92,42,.2);border:1px solid rgba(200,92,42,.4);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--brand);margin-bottom:28px}

  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:28px}

  .form-group{margin-bottom:18px}
  label{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;margin-bottom:7px}
  input[type=text],input[type=password]{
    width:100%;height:46px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);
    border-radius:var(--radius);padding:0 14px;
    font-size:14px;font-family:'Noto Sans TC',sans-serif;
    color:var(--white);outline:none;transition:border-color .2s
  }
  input::placeholder{color:rgba(255,255,255,.3)}
  input:focus{border-color:var(--brand);background:rgba(255,255,255,.1)}

  .alert{display:none;background:rgba(192,57,43,.2);border:1px solid rgba(192,57,43,.4);border-radius:8px;padding:10px 14px;font-size:13px;color:#F0997B;margin-bottom:16px;align-items:center;gap:8px}
  .alert.show{display:flex}

  .btn-login{width:100%;height:48px;background:var(--brand);color:var(--white);border:none;border-radius:var(--radius);font-size:15px;font-family:'Noto Sans TC',sans-serif;font-weight:500;cursor:pointer;letter-spacing:.06em;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
  .btn-login:hover{background:var(--brand-dk)}
  .btn-login:disabled{opacity:.5;cursor:not-allowed}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .btn-login.loading .spinner{display:block}
  .btn-login.loading .btn-text{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  .footer{text-align:center;margin-top:24px;font-size:12px;color:var(--ink-3)}
  .back-link{color:var(--ink-3);text-decoration:none;font-size:12px;margin-top:16px;display:block;text-align:center;transition:color .2s}
  .back-link:hover{color:var(--white)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <div class="logo-mark">🍊</div>
    <div class="logo-title">國際柑仔店</div>
    <div class="logo-sub">MASCOT INTERNATIONAL</div>
  </div>

  <div style="text-align:center">
    <div class="admin-badge">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1L7.5 4.5H11L8 7L9 11L6 9L3 11L4 7L1 4.5H4.5L6 1Z" fill="currentColor"/></svg>
      管理員專用
    </div>
  </div>

  <div class="card">
    <div class="alert" id="alertBar">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.2"/><line x1="7" y1="4.5" x2="7" y2="7.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="9.5" r=".6" fill="currentColor"/></svg>
      <span id="alertText"></span>
    </div>

    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>管理員帳號</label>
        <input type="text" id="account" placeholder="請輸入帳號" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text">登入管理後台</span>
      </button>
    </form>
  </div>

  <a href="../index.html" class="back-link">← 返回經銷商登入</a>
  <div class="footer" style="margin-top:12px">© 2025 國際柑仔店 Mascot International</div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwQE0fz5u1mvUctWmA2UgDf5V5kDJljmH4whhgZ5LZClNjbxr_dxRPyyvNmNTCSAP5xSg/exec';

if (sessionStorage.getItem('admin')) window.location.href = 'dashboard.html';

async function doLogin(e) {
  e.preventDefault();
  const btn      = document.getElementById('loginBtn');
  const alertEl  = document.getElementById('alertBar');
  const account  = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;

  alertEl.classList.remove('show');
  btn.disabled = true; btn.classList.add('loading');

  try {
    const url = GAS_URL
      + '?action=login'
      + '&account='  + encodeURIComponent(account)
      + '&password=' + encodeURIComponent(password);

    const res  = await fetch(url);
    const data = await res.json();

    if (data.success && data.role === 'admin') {
      sessionStorage.setItem('admin', JSON.stringify({ account: data.account, name: data.name, token: data.token }));
      window.location.href = 'dashboard.html';
    } else if (data.success && data.role !== 'admin') {
      showAlert('此帳號不具管理員權限');
    } else {
      showAlert(data.message || '帳號或密碼錯誤');
    }
  } catch (err) {
    showAlert('連線失敗：' + err.message);
  } finally {
    btn.disabled = false; btn.classList.remove('loading');
  }
}

function showAlert(msg) {
  document.getElementById('alertText').textContent = msg;
  document.getElementById('alertBar').classList.add('show');
}
</script>
</body>
</html>
