<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>確認訂單 — 國際柑仔店經銷商訂購系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --brand:#C85C2A; --brand-lt:#F5EDE6; --brand-dk:#8C3D18;
    --ink:#1A1410; --ink-2:#5A4A3A; --ink-3:#9A8A7A;
    --surface:#FDFAF7; --surface-2:#F5EDE6;
    --line:#E8DDD4; --white:#FFFFFF;
    --success:#2E7D52; --success-lt:#EAF5EE;
    --danger:#C0392B; --danger-lt:#FEF2F2;
    --radius:10px; --nav-h:60px;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}

  /* NAV */
  .nav{height:var(--nav-h);background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
  .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .nav-logo{width:32px;height:32px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .nav-name{font-family:'Noto Serif TC',serif;font-size:15px;color:var(--white);letter-spacing:.04em}
  .nav-right{display:flex;align-items:center;gap:12px}
  .nav-dealer{font-size:13px;color:#9A8A7A}
  .nav-dealer span{color:var(--white);font-weight:500}
  .btn-back{background:transparent;border:1px solid rgba(255,255,255,.2);color:#9A8A7A;border-radius:var(--radius);padding:7px 14px;font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .2s}
  .btn-back:hover{color:var(--white);border-color:rgba(255,255,255,.4)}

  /* LAYOUT */
  .page{max-width:960px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}

  /* 區塊 */
  .card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
  .card-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .card-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:600;color:var(--ink)}
  .card-body{padding:20px}

  /* 表單 */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-full{grid-column:1/-1}
  .form-group{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.05em}
  label .req{color:var(--brand);margin-left:2px}
  input[type=text],input[type=tel],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-size:14px;font-family:'Noto Sans TC',sans-serif;
    color:var(--ink);background:var(--white);outline:none;transition:border-color .2s
  }
  input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,92,42,.1)}
  textarea{resize:vertical;min-height:80px;line-height:1.6}
  .err{font-size:12px;color:var(--danger);margin-top:4px;display:none}
  .err.show{display:block}

  /* 購物車摘要 */
  .order-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .order-item:last-child{border-bottom:none}
  .oi-icon{width:40px;height:40px;background:var(--surface-2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .oi-info{flex:1;min-width:0}
  .oi-name{font-size:13px;font-weight:500;color:var(--ink)}
  .oi-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
  .oi-price{font-size:13px;font-weight:600;color:var(--brand);flex-shrink:0}

  /* 合計區 */
  .sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);padding:6px 0}
  .sum-total{font-size:17px;font-weight:600;color:var(--ink);padding-top:10px;border-top:1px solid var(--line)}

  /* 送出按鈕 */
  .btn-submit{
    width:100%;height:50px;background:var(--brand);color:var(--white);
    border:none;border-radius:var(--radius);font-size:15px;font-weight:500;
    font-family:'Noto Sans TC',sans-serif;cursor:pointer;
    transition:background .2s;letter-spacing:.05em;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px
  }
  .btn-submit:hover{background:var(--brand-dk)}
  .btn-submit:disabled{opacity:.5;cursor:not-allowed}
  .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .btn-submit.loading .spinner{display:block}
  .btn-submit.loading .btn-text{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 成功畫面 */
  .success-wrap{text-align:center;padding:40px 24px}
  .success-icon{width:64px;height:64px;background:var(--success-lt);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px}
  .success-title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:600;color:var(--ink);margin-bottom:8px}
  .success-oid{font-size:14px;color:var(--ink-3);margin-bottom:24px}
  .success-oid strong{color:var(--brand);font-size:16px}
  .btn-group{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn-outline{padding:10px 20px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-family:'Noto Sans TC',sans-serif;background:var(--white);color:var(--ink-2);cursor:pointer;transition:all .2s}
  .btn-outline:hover{border-color:var(--brand);color:var(--brand)}

  /* 空購物車 */
  .empty-wrap{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--ink-3)}
  .empty-wrap p{font-size:15px;margin-top:12px}

  /* alert */
  .alert{display:none;background:var(--danger-lt);border:1px solid #FECACA;border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--danger);margin-bottom:16px;align-items:center;gap:8px}
  .alert.show{display:flex}

  @media(max-width:768px){
    .page{grid-template-columns:1fr}
    .form-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="catalog.html">
    <div class="nav-logo">🍊</div>
    <span class="nav-name">國際柑仔店</span>
  </a>
  <div class="nav-right">
    <span class="nav-dealer">歡迎，<span id="dealerName">載入中...</span></span>
    <button class="btn-back" onclick="history.back()">← 返回目錄</button>
  </div>
</nav>

<div class="page" id="mainPage">

  <!-- 左：收件資訊表單 -->
  <div id="formSide">
    <div class="card">
      <div class="card-head">
        <span class="card-title">收件資訊</span>
      </div>
      <div class="card-body">
        <div class="alert" id="alertBar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2"/><line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11" r=".7" fill="currentColor"/></svg>
          <span id="alertText"></span>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>收件人<span class="req">*</span></label>
            <input type="text" id="recipient" placeholder="請輸入姓名">
            <span class="err" id="err-recipient">請填寫收件人姓名</span>
          </div>
          <div class="form-group">
            <label>聯絡電話<span class="req">*</span></label>
            <input type="tel" id="phone" placeholder="09xxxxxxxx">
            <span class="err" id="err-phone">請填寫聯絡電話</span>
          </div>
          <div class="form-group form-full">
            <label>收件地址<span class="req">*</span></label>
            <input type="text" id="address" placeholder="縣市 + 鄉鎮市區 + 詳細地址">
            <span class="err" id="err-address">請填寫收件地址</span>
          </div>
          <div class="form-group form-full">
            <label>訂單備註</label>
            <textarea id="note" placeholder="特殊需求、到貨時間偏好...（選填）"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 右：訂單摘要 -->
  <div id="summarySide">
    <div class="card">
      <div class="card-head">
        <span class="card-title">訂單明細</span>
        <span id="itemCount" style="font-size:12px;color:var(--ink-3)"></span>
      </div>
      <div class="card-body" id="orderItems"></div>
    </div>

    <div class="card">
      <div class="card-body" id="orderSummary"></div>
      <div style="padding:0 20px 20px">
        <button class="btn-submit" id="submitBtn" onclick="submitOrder()">
          <span class="spinner"></span>
          <span class="btn-text">確認送出訂單</span>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- 成功畫面（隱藏） -->
<div id="successPage" style="display:none;max-width:520px;margin:80px auto;padding:0 24px">
  <div class="success-wrap card">
    <div class="success-icon">✓</div>
    <div class="success-title">訂單已送出！</div>
    <div class="success-oid">您的訂單編號：<br><strong id="resultOid"></strong></div>
    <div style="font-size:13px;color:var(--ink-3);margin-bottom:24px">業務專員將於 1-2 個工作天內與您確認</div>
    <div class="btn-group">
      <button class="btn-outline" onclick="window.location.href='catalog.html'">繼續選購</button>
      <button class="btn-outline" onclick="window.location.href='orders.html'" style="border-color:var(--brand);color:var(--brand)">查看我的訂單</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwQE0fz5u1mvUctWmA2UgDf5V5kDJljmH4whhgZ5LZClNjbxr_dxRPyyvNmNTCSAP5xSg/exec';

let dealer = null;
let cart   = {};
let prods  = [];

window.addEventListener('DOMContentLoaded', () => {
  dealer = JSON.parse(sessionStorage.getItem('dealer') || 'null');
  if (!dealer) { window.location.href = 'index.html'; return; }
  document.getElementById('dealerName').textContent = dealer.name || dealer.account;

  cart  = JSON.parse(sessionStorage.getItem('pendingCart') || '{}');
  prods = JSON.parse(sessionStorage.getItem('cachedProducts') || '[]');

  const entries = Object.entries(cart).filter(([,q]) => q > 0);
  if (!entries.length) {
    document.getElementById('mainPage').innerHTML =
      '<div class="empty-wrap"><svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="#9A8A7A" stroke-width="1.2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><p>購物車是空的，請先選擇商品</p><br><button class="btn-outline" onclick="location.href=\'catalog.html\'">前往商品目錄</button></div>';
    return;
  }

  renderItems(entries);
});

function renderItems(entries) {
  const itemsEl = document.getElementById('orderItems');
  const sumEl   = document.getElementById('orderSummary');
  document.getElementById('itemCount').textContent = entries.length + ' 種商品';

  let totalAmt = 0; let totalQty = 0;
  itemsEl.innerHTML = entries.map(([id, qty]) => {
    const p = prods.find(x => x.id === id) || { name: id, unit: '件', price: 0, icon: '📦' };
    const sub = p.price * qty;
    totalAmt += sub; totalQty += qty;
    return `<div class="order-item">
      <div class="oi-icon">${p.imgUrl ? `<img src="${p.imgUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px">` : (p.icon || '📦')}</div>
      <div class="oi-info">
        <div class="oi-name">${p.name}</div>
        <div class="oi-sub">${qty} ${p.unit} × NT$${p.price.toLocaleString()}</div>
      </div>
      <div class="oi-price">NT$${sub.toLocaleString()}</div>
    </div>`;
  }).join('');

  sumEl.innerHTML = `
    <div class="sum-row"><span>商品種類</span><span>${entries.length} 種</span></div>
    <div class="sum-row"><span>訂購數量</span><span>${totalQty} 件</span></div>
    <div class="sum-row sum-total"><span>訂單金額</span><span>NT$${totalAmt.toLocaleString()}</span></div>`;
}

function validate() {
  let ok = true;
  const fields = [
    { id: 'recipient', errId: 'err-recipient', check: v => v.trim().length > 0 },
    { id: 'phone',     errId: 'err-phone',     check: v => /^[0-9\-+\s]{7,}$/.test(v.trim()) },
    { id: 'address',   errId: 'err-address',   check: v => v.trim().length > 5 },
  ];
  fields.forEach(f => {
    const val = document.getElementById(f.id).value;
    const err = document.getElementById(f.errId);
    if (!f.check(val)) { err.classList.add('show'); ok = false; }
    else err.classList.remove('show');
  });
  return ok;
}

async function submitOrder() {
  if (!validate()) return;

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.classList.add('loading');
  document.getElementById('alertBar').classList.remove('show');

  const cartArr = Object.entries(cart)
    .filter(([,q]) => q > 0)
    .map(([id, qty]) => ({ id, qty }));

  const info = {
    recipient : document.getElementById('recipient').value.trim(),
    phone     : document.getElementById('phone').value.trim(),
    address   : document.getElementById('address').value.trim(),
    note      : document.getElementById('note').value.trim(),
  };

  try {
    const url = GAS_URL
      + '?action=submitOrder'
      + '&token=' + encodeURIComponent(dealer.token)
      + '&cart='  + encodeURIComponent(JSON.stringify(cartArr))
      + '&info='  + encodeURIComponent(JSON.stringify(info));

    const res  = await fetch(url);
    const data = await res.json();

    if (data.success) {
      sessionStorage.removeItem('pendingCart');
      document.getElementById('mainPage').style.display = 'none';
      document.getElementById('resultOid').textContent = data.orderId;
      document.getElementById('successPage').style.display = 'block';
    } else {
      showAlert(data.message || '送出失敗，請重試');
    }
  } catch (err) {
    showAlert('連線失敗：' + err.message);
  } finally {
    btn.disabled = false; btn.classList.remove('loading');
  }
}

function showAlert(msg) {
  document.getElementById('alertText').textContent = msg;
  document.getElementById('alertBar').classList.add('show');
}
</script>
</body>
</html>
