<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的訂單 — 國際柑仔店經銷商訂購系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --brand:#C85C2A;--brand-lt:#F5EDE6;--brand-dk:#8C3D18;
    --ink:#1A1410;--ink-2:#5A4A3A;--ink-3:#9A8A7A;
    --surface:#FDFAF7;--surface-2:#F5EDE6;--line:#E8DDD4;--white:#FFFFFF;
    --success:#2E7D52;--success-lt:#EAF5EE;
    --warning:#B45309;--warning-lt:#FEF3C7;
    --danger:#C0392B;--danger-lt:#FEF2F2;
    --blue:#1565C0;--blue-lt:#E3F2FD;
    --radius:10px;--nav-h:60px;
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh}

  /* NAV */
  .nav{height:var(--nav-h);background:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px;position:sticky;top:0;z-index:50}
  .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .nav-logo{width:32px;height:32px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .nav-name{font-family:'Noto Serif TC',serif;font-size:15px;color:var(--white);letter-spacing:.04em}
  .nav-right{display:flex;align-items:center;gap:14px}
  .nav-link{color:#9A8A7A;font-size:13px;text-decoration:none;transition:color .2s}
  .nav-link:hover,.nav-link.active{color:var(--white)}
  .nav-link.active{font-weight:500}
  .nav-dealer{font-size:13px;color:#9A8A7A}
  .nav-dealer span{color:var(--white);font-weight:500}
  .btn-logout{background:transparent;border:1px solid rgba(255,255,255,.15);color:#9A8A7A;border-radius:var(--radius);padding:7px 12px;font-size:12px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .2s}
  .btn-logout:hover{color:var(--white);border-color:rgba(255,255,255,.4)}

  /* PAGE */
  .page{max-width:900px;margin:0 auto;padding:28px 24px}

  /* PAGE HEADER */
  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .page-title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:600}
  .btn-catalog{display:flex;align-items:center;gap:6px;padding:9px 18px;background:var(--brand);color:var(--white);border:none;border-radius:var(--radius);font-size:13px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;text-decoration:none;transition:background .2s}
  .btn-catalog:hover{background:var(--brand-dk)}

  /* 篩選工具列 */
  .filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .filter-select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 32px 0 12px;font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--ink-2);background:var(--white);outline:none;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%239A8A7A' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center}
  .result-count{font-size:13px;color:var(--ink-3);margin-left:auto}

  /* 訂單卡片 */
  .order-card{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;transition:border-color .2s}
  .order-card:hover{border-color:var(--brand)}

  .order-head{padding:16px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
  .order-head:hover{background:var(--surface)}

  .oid{font-family:monospace;font-size:13px;font-weight:500;color:var(--ink);flex-shrink:0}
  .odate{font-size:12px;color:var(--ink-3);flex-shrink:0}
  .oamt{font-size:15px;font-weight:600;color:var(--brand);margin-left:auto;flex-shrink:0}
  .ostatus{flex-shrink:0}

  .pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
  .pill-pending {background:var(--warning-lt);color:var(--warning)}
  .pill-confirm {background:var(--blue-lt);color:var(--blue)}
  .pill-prep    {background:var(--blue-lt);color:var(--blue)}
  .pill-shipped {background:var(--success-lt);color:var(--success)}
  .pill-done    {background:var(--success-lt);color:var(--success)}
  .pill-cancel  {background:var(--danger-lt);color:var(--danger)}

  .chevron{width:20px;height:20px;color:var(--ink-3);transition:transform .25s;flex-shrink:0}
  .order-card.open .chevron{transform:rotate(180deg)}

  /* 展開明細 */
  .order-detail{display:none;border-top:1px solid var(--line)}
  .order-card.open .order-detail{display:block}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--line)}
  .detail-info{padding:16px 20px}
  .detail-info-title{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;margin-bottom:10px}
  .info-row{display:flex;gap:8px;font-size:13px;margin-bottom:6px;align-items:baseline}
  .info-label{color:var(--ink-3);font-size:12px;flex-shrink:0;width:52px}
  .info-val{color:var(--ink)}

  .detail-items{padding:16px 20px;border-left:1px solid var(--line)}
  .detail-items-title{font-size:11px;font-weight:500;color:var(--ink-3);letter-spacing:.06em;margin-bottom:10px}

  .item-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .item-row:last-child{border-bottom:none}
  .item-name{flex:1;font-size:13px;color:var(--ink)}
  .item-qty{font-size:12px;color:var(--ink-3);flex-shrink:0}
  .item-sub{font-size:13px;font-weight:500;color:var(--ink);flex-shrink:0;min-width:70px;text-align:right}

  .order-foot{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
  .foot-note{font-size:12px;color:var(--ink-3)}
  .foot-total{font-size:15px;font-weight:600;color:var(--brand)}

  /* 空狀態 */
  .empty-wrap{text-align:center;padding:80px 20px;color:var(--ink-3)}
  .empty-wrap p{font-size:14px;margin-top:10px}

  /* loading */
  .skeleton{background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:8px}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--white);padding:11px 20px;border-radius:24px;font-size:13px;z-index:999;transition:transform .3s;white-space:nowrap}
  .toast.show{transform:translateX(-50%) translateY(0)}

  @media(max-width:600px){
    .nav-dealer,.odate{display:none}
    .detail-grid{grid-template-columns:1fr}
    .detail-items{border-left:none;border-top:1px solid var(--line)}
    .page{padding:16px}
  }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="catalog.html">
    <div class="nav-logo">🍊</div>
    <span class="nav-name">國際柑仔店</span>
  </a>
  <div class="nav-right">
    <span class="nav-dealer">歡迎，<span id="dealerName">載入中...</span></span>
    <a href="catalog.html" class="nav-link">商品目錄</a>
    <a href="orders.html"  class="nav-link active">我的訂單</a>
    <button class="btn-logout" onclick="logout()">登出</button>
  </div>
</nav>

<div class="page">

  <div class="page-head">
    <h1 class="page-title">我的訂單</h1>
    <a href="catalog.html" class="btn-catalog">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
      繼續選購
    </a>
  </div>

  <!-- 篩選 -->
  <div class="filter-bar">
    <select class="filter-select" id="statusFilter" onchange="filterOrders()">
      <option value="">全部狀態</option>
      <option value="待確認">待確認</option>
      <option value="已確認">已確認</option>
      <option value="備貨中">備貨中</option>
      <option value="已出貨">已出貨</option>
      <option value="已完成">已完成</option>
      <option value="已取消">已取消</option>
    </select>
    <select class="filter-select" id="monthFilter" onchange="filterOrders()">
      <option value="">全部時間</option>
    </select>
    <button onclick="loadOrders()" style="height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--white);font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s" onmouseover="this.style.borderColor='var(--brand)'" onmouseout="this.style.borderColor='var(--line)'">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 6.5A5.5 5.5 0 106.5 1" stroke-linecap="round"/><polyline points="1 1 1 6.5 6.5 6.5" fill="none"/></svg>
      重新整理
    </button>
    <span class="result-count" id="resultCount"></span>
  </div>

  <!-- 訂單列表 -->
  <div id="orderList"></div>

</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzbrEhEC44y6mA-ThVDklFrvZs_HlagR4si8UgE7MRWtE_1GXSTU0Q-QiI7GxcFO4SfmA/exec';

let dealer    = null;
let allOrders = [];

window.addEventListener('DOMContentLoaded', () => {
  dealer = JSON.parse(sessionStorage.getItem('dealer') || 'null');
  if (!dealer) { window.location.href = 'index.html'; return; }
  document.getElementById('dealerName').textContent = dealer.name || dealer.account;
  loadOrders();
});

function logout() {
  sessionStorage.removeItem('dealer');
  window.location.href = 'index.html';
}

// ── 載入訂單 ──
async function loadOrders() {
  showSkeleton();
  try {
    const url  = GAS_URL + '?action=getOrders&token=' + encodeURIComponent(dealer.token);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      allOrders = data.orders;
      buildMonthFilter();
      filterOrders();
    } else if (data.message && data.message.includes('認證')) {
      sessionStorage.removeItem('dealer');
      window.location.href = 'index.html';
    } else {
      document.getElementById('orderList').innerHTML = '<div class="empty-wrap"><p>' + (data.message || '載入失敗') + '</p></div>';
    }
  } catch(err) {
    document.getElementById('orderList').innerHTML = '<div class="empty-wrap"><p>連線失敗，請稍後再試</p></div>';
  }
}

// ── 月份篩選建立 ──
function buildMonthFilter() {
  const months = [...new Set(allOrders.map(o => o.createdAt.slice(0,7)))].sort().reverse();
  const sel = document.getElementById('monthFilter');
  sel.innerHTML = '<option value="">全部時間</option>' +
    months.map(m => `<option value="${m}">${m.replace('-','年')}月</option>`).join('');
}

// ── 篩選 ──
function filterOrders() {
  const status = document.getElementById('statusFilter').value;
  const month  = document.getElementById('monthFilter').value;
  let list = allOrders.filter(o =>
    (!status || o.status === status) &&
    (!month  || o.createdAt.startsWith(month))
  );
  document.getElementById('resultCount').textContent = '共 ' + list.length + ' 筆訂單';
  renderOrders(list);
}

// ── 狀態 pill ──
function statusPill(s) {
  const map = {
    '待確認':'pill-pending','已確認':'pill-confirm',
    '備貨中':'pill-prep','已出貨':'pill-shipped',
    '已完成':'pill-done','已取消':'pill-cancel'
  };
  return `<span class="pill ${map[s]||'pill-pending'}">${s}</span>`;
}

// ── 渲染 ──
function renderOrders(list) {
  const el = document.getElementById('orderList');

  if (!list.length) {
    el.innerHTML = `
      <div class="empty-wrap">
        <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="var(--ink-3)" stroke-width="1.2">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        <p>目前沒有訂單紀錄</p>
      </div>`;
    return;
  }

  el.innerHTML = list.map((o, idx) => {
    const itemRows = (o.items || []).map(i => `
      <div class="item-row">
        <div class="item-name">${i.name}</div>
        <div class="item-qty">${i.qty} ${i.unit} × NT$${i.price.toLocaleString()}</div>
        <div class="item-sub">NT$${i.sub.toLocaleString()}</div>
      </div>`).join('');

    const dateStr = o.createdAt.replace('T',' ').slice(0,16);

    return `
    <div class="order-card" id="card-${idx}">
      <div class="order-head" onclick="toggleCard(${idx})">
        <div>
          <div class="oid">${o.orderId}</div>
          <div class="odate" style="margin-top:3px">${dateStr}</div>
        </div>
        ${statusPill(o.status)}
        <div class="oamt">NT$${o.totalAmt.toLocaleString()}</div>
        <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="5 8 10 13 15 8"/>
        </svg>
      </div>

      <div class="order-detail">
        <div class="detail-grid">
          <div class="detail-info">
            <div class="detail-info-title">收件資訊</div>
            <div class="info-row"><span class="info-label">收件人</span><span class="info-val">${o.recipient}</span></div>
            <div class="info-row"><span class="info-label">電話</span><span class="info-val">${o.phone}</span></div>
            <div class="info-row"><span class="info-label">地址</span><span class="info-val">${o.address}</span></div>
            ${o.note ? `<div class="info-row"><span class="info-label">備註</span><span class="info-val">${o.note}</span></div>` : ''}
          </div>
          <div class="detail-items">
            <div class="detail-items-title">訂購明細（${(o.items||[]).length} 種商品）</div>
            ${itemRows || '<div style="font-size:13px;color:var(--ink-3)">無明細資料</div>'}
          </div>
        </div>
        <div class="order-foot">
          <span class="foot-note">${o.note ? '備註：' + o.note : '下單後業務專員將於 1-2 工作天確認'}</span>
          <span class="foot-total">合計 NT$${o.totalAmt.toLocaleString()}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(idx) {
  document.getElementById('card-' + idx).classList.toggle('open');
}

// ── Skeleton ──
function showSkeleton() {
  document.getElementById('orderList').innerHTML = Array(3).fill(`
    <div class="order-card" style="margin-bottom:12px">
      <div style="padding:16px 20px;display:flex;gap:14px;align-items:center">
        <div class="skeleton" style="width:160px;height:18px"></div>
        <div class="skeleton" style="width:56px;height:22px;border-radius:20px;margin-left:auto"></div>
        <div class="skeleton" style="width:80px;height:20px"></div>
      </div>
    </div>`).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
</body>
</html>
