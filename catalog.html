<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品目錄 — 國際柑仔店經銷商訂購系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --brand:    #C85C2A;
    --brand-lt: #F5EDE6;
    --brand-dk: #8C3D18;
    --ink:      #1A1410;
    --ink-2:    #5A4A3A;
    --ink-3:    #9A8A7A;
    --surface:  #FDFAF7;
    --surface-2:#F5EDE6;
    --line:     #E8DDD4;
    --white:    #FFFFFF;
    --success:  #2E7D52;
    --success-lt:#EAF5EE;
    --warning:  #B45309;
    --warning-lt:#FEF3C7;
    --danger:   #C0392B;
    --danger-lt:#FEF2F2;
    --radius:   10px;
    --nav-h:    60px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--surface);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ══ NAV ══ */
  .nav {
    position: sticky; top: 0; z-index: 100;
    height: var(--nav-h);
    background: var(--ink);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    gap: 16px;
  }

  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
  }

  .nav-logo {
    width: 32px; height: 32px;
    background: var(--brand);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }

  .nav-name {
    font-family: 'Noto Serif TC', serif;
    font-size: 15px;
    color: var(--white);
    letter-spacing: 0.04em;
  }

  .nav-right {
    display: flex; align-items: center; gap: 12px;
  }

  .nav-dealer {
    font-size: 13px;
    color: var(--ink-3);
  }

  .nav-dealer span {
    color: var(--white);
    font-weight: 500;
  }

  .btn-cart {
    position: relative;
    display: flex; align-items: center; gap: 7px;
    background: var(--brand);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn-cart:hover { background: var(--brand-dk); }

  .cart-badge {
    background: var(--white);
    color: var(--brand);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    padding: 1px 6px;
    min-width: 18px;
    text-align: center;
  }

  .btn-logout {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--ink-3);
    border-radius: var(--radius);
    padding: 7px 12px;
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-logout:hover { color: var(--white); border-color: rgba(255,255,255,0.4); }

  /* ══ LAYOUT ══ */
  .page {
    display: flex;
    min-height: calc(100vh - var(--nav-h));
  }

  /* ══ SIDEBAR ══ */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    padding: 24px 16px;
    border-right: 1px solid var(--line);
    background: var(--white);
    position: sticky;
    top: var(--nav-h);
    height: calc(100vh - var(--nav-h));
    overflow-y: auto;
  }

  .sidebar-title {
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    padding: 0 8px;
  }

  .cat-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: none;
    background: transparent;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    margin-bottom: 2px;
  }

  .cat-item:hover { background: var(--surface); color: var(--ink); }

  .cat-item.active {
    background: var(--brand-lt);
    color: var(--brand-dk);
    font-weight: 500;
  }

  .cat-count {
    font-size: 11px;
    color: var(--ink-3);
    background: var(--surface);
    border-radius: 10px;
    padding: 1px 6px;
  }

  .cat-item.active .cat-count {
    background: rgba(200,92,42,0.15);
    color: var(--brand);
  }

  .sidebar-sep {
    height: 1px;
    background: var(--line);
    margin: 16px 8px;
  }

  /* ══ MAIN ══ */
  .main {
    flex: 1;
    padding: 24px;
    overflow: hidden;
  }

  /* toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 320px;
  }

  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--ink-3);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 12px 0 36px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--white);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--brand); }
  .search-input::placeholder { color: var(--ink-3); }

  .sort-select {
    height: 38px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 32px 0 12px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--white);
    color: var(--ink-2);
    cursor: pointer;
    outline: none;
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%239A8A7A' stroke-width='1.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }

  .view-toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--white);
  }

  .view-btn {
    width: 38px; height: 38px;
    border: none; background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }

  .view-btn.active { background: var(--brand-lt); color: var(--brand); }
  .view-btn:hover:not(.active) { background: var(--surface); }

  /* 結果計數 */
  .result-info {
    font-size: 12px;
    color: var(--ink-3);
    margin-bottom: 16px;
  }

  /* ══ GRID VIEW ══ */
  .grid-view {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
    gap: 14px;
  }

  .product-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.15s;
    display: flex; flex-direction: column;
  }

  .product-card:hover {
    border-color: var(--brand);
    transform: translateY(-2px);
  }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    position: relative;
  }

  .card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .card-badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 10px; font-weight: 500;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .badge-new { background: var(--brand); color: white; }
  .badge-hot { background: var(--ink); color: white; }

  .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }

  .card-cat {
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .card-name {
    font-size: 14px; font-weight: 500;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .card-price {
    font-size: 17px; font-weight: 600;
    color: var(--brand);
    margin-bottom: 3px;
  }

  .card-price span {
    font-size: 12px; font-weight: 400;
    color: var(--ink-3);
  }

  .card-moq {
    font-size: 11px;
    color: var(--ink-3);
    margin-bottom: 10px;
  }

  .stock-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .stock-dot { width: 5px; height: 5px; border-radius: 50%; }

  .stock-ok  { background: var(--success-lt); color: var(--success); }
  .stock-ok  .stock-dot { background: var(--success); }
  .stock-low { background: var(--warning-lt); color: var(--warning); }
  .stock-low .stock-dot { background: var(--warning); }
  .stock-out { background: var(--danger-lt); color: var(--danger); }
  .stock-out .stock-dot { background: var(--danger); }

  .card-footer { margin-top: auto; }

  .qty-ctrl {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }

  .qty-btn {
    width: 28px; height: 28px;
    border: 1px solid var(--line);
    background: var(--white);
    border-radius: 7px;
    font-size: 15px; color: var(--ink-2);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .qty-btn:hover { border-color: var(--brand); color: var(--brand); }

  .qty-input {
    flex: 1;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 7px;
    text-align: center;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: var(--white);
    outline: none;
    min-width: 0;
  }

  .qty-input:focus { border-color: var(--brand); }

  .btn-add {
    width: 100%;
    height: 34px;
    background: var(--brand-lt);
    color: var(--brand-dk);
    border: 1px solid var(--brand);
    border-radius: 8px;
    font-size: 12px; font-weight: 500;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }

  .btn-add:hover { background: var(--brand); color: white; }

  .btn-add.added {
    background: var(--success-lt);
    color: var(--success);
    border-color: var(--success);
  }

  .btn-add:disabled {
    opacity: 0.4; cursor: not-allowed;
    background: var(--surface); color: var(--ink-3); border-color: var(--line);
  }

  /* ══ LIST VIEW ══ */
  .list-view {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  .list-header {
    display: grid;
    grid-template-columns: 44px 1fr 72px 90px 88px 120px;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.05em;
  }

  .list-row {
    display: grid;
    grid-template-columns: 44px 1fr 72px 90px 88px 120px;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    align-items: center;
    font-size: 13px;
    transition: background 0.1s;
  }

  .list-row:last-child { border-bottom: none; }
  .list-row:hover { background: var(--surface); }

  .list-icon {
    width: 40px; height: 40px;
    background: var(--surface-2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    overflow: hidden; flex-shrink: 0;
  }

  .list-icon img { width: 100%; height: 100%; object-fit: cover; }

  .list-name { font-weight: 500; color: var(--ink); }
  .list-sub  { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .list-price { font-weight: 600; color: var(--brand); }
  .list-moq   { font-size: 12px; color: var(--ink-3); }

  .list-qty-ctrl {
    display: flex; align-items: center; gap: 4px;
  }

  .list-qty-ctrl .qty-btn  { width: 24px; height: 24px; font-size: 13px; }
  .list-qty-ctrl .qty-input { width: 44px; height: 24px; font-size: 12px; }
  .list-qty-ctrl .btn-add  { width: 58px; height: 28px; font-size: 11px; flex-shrink: 0; }

  /* ══ 空狀態 ══ */
  .empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-3);
  }

  .empty-state p { font-size: 14px; margin-top: 8px; }

  /* ══ 購物車側邊欄 ══ */
  .cart-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: rgba(26,20,16,0.4);
  }

  .cart-overlay.open { display: block; }

  .cart-panel {
    position: fixed; top: 0; right: -440px; bottom: 0;
    width: 420px; max-width: 100vw;
    background: var(--white);
    z-index: 201;
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line);
    transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  .cart-panel.open { right: 0; }

  .cart-head {
    padding: 20px 24px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }

  .cart-head h3 {
    font-family: 'Noto Serif TC', serif;
    font-size: 17px;
    color: var(--ink);
  }

  .btn-close {
    width: 32px; height: 32px;
    background: var(--surface);
    border: none; border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2);
    font-size: 18px;
    transition: background 0.15s;
  }

  .btn-close:hover { background: var(--line); }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
  }

  .cart-empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 12px;
    color: var(--ink-3); font-size: 14px;
  }

  .cart-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .cart-item:last-child { border-bottom: none; }

  .ci-icon {
    width: 44px; height: 44px;
    background: var(--surface-2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    overflow: hidden;
  }

  .ci-icon img { width: 100%; height: 100%; object-fit: cover; }

  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 13px; font-weight: 500; color: var(--ink); }
  .ci-sub  { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

  .ci-right { flex-shrink: 0; text-align: right; }
  .ci-price { font-size: 13px; font-weight: 600; color: var(--brand); }

  .ci-remove {
    background: none; border: none; cursor: pointer;
    font-size: 12px; color: var(--ink-3);
    margin-top: 4px; padding: 0;
    transition: color 0.15s;
  }
  .ci-remove:hover { color: var(--danger); }

  .cart-foot {
    padding: 20px 24px;
    border-top: 1px solid var(--line);
  }

  .cart-summary {
    display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 16px;
  }

  .sum-row {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--ink-2);
  }

  .sum-row.total {
    font-size: 16px; font-weight: 600; color: var(--ink);
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }

  .btn-order {
    width: 100%;
    height: 48px;
    background: var(--brand);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 15px; font-weight: 500;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.05em;
  }

  .btn-order:hover { background: var(--brand-dk); }
  .btn-order:disabled { opacity: 0.5; cursor: not-allowed; }

  /* toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: white;
    padding: 11px 20px;
    border-radius: 24px;
    font-size: 13px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* loading skeleton */
  .skeleton {
    background: linear-gradient(90deg, var(--line) 25%, var(--surface-2) 50%, var(--line) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    border-radius: 6px;
  }

  @keyframes shimmer { to { background-position: -200% 0; } }

  /* RWD */
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .list-header,
    .list-row { grid-template-columns: 44px 1fr 90px 100px; }
    .list-header > *:nth-child(3),
    .list-row > *:nth-child(3),
    .list-header > *:nth-child(4),
    .list-row > *:nth-child(4) { display: none; }
  }

  @media (max-width: 600px) {
    .main { padding: 16px; }
    .nav { padding: 0 16px; }
    .nav-dealer { display: none; }
    .grid-view { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cart-panel { width: 100%; }
  }
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav class="nav">
  <a class="nav-brand" href="index.html">
    <div class="nav-logo">🍊</div>
    <span class="nav-name">國際柑仔店</span>
  </a>
  <div class="nav-right">
    <span class="nav-dealer">歡迎，<span id="dealerName">載入中...</span></span>
    <button class="btn-cart" onclick="openCart()">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
        <path d="M1 1h2l2 8h7l1.5-5H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="6" cy="12" r="1" fill="currentColor"/>
        <circle cx="11" cy="12" r="1" fill="currentColor"/>
      </svg>
      購物車 <span class="cart-badge" id="cartBadge">0</span>
    </button>
    <a href="orders.html" style="color:var(--ink-3);font-size:13px;text-decoration:none;transition:color .2s" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--ink-3)'">我的訂單</a>
    <button class="btn-logout" onclick="logout()">登出</button>
  </div>
</nav>

<!-- ── PAGE LAYOUT ── -->
<div class="page">

  <!-- 側邊分類 -->
  <aside class="sidebar">
    <div class="sidebar-title">商品分類</div>
    <div id="catList"></div>
  </aside>

  <!-- 主內容 -->
  <main class="main">

    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2"/>
          <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input class="search-input" type="text" id="searchInput" placeholder="搜尋商品名稱..." oninput="renderProducts()">
      </div>

      <select class="sort-select" id="sortSelect" onchange="renderProducts()">
        <option value="default">預設排序</option>
        <option value="price_asc">價格：低到高</option>
        <option value="price_desc">價格：高到低</option>
        <option value="name_asc">名稱：A–Z</option>
      </select>

      <div class="view-toggle">
        <button class="view-btn active" id="vgBtn" title="卡片" onclick="setView('grid')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="0.5" y="0.5" width="5.5" height="5.5" rx="1"/><rect x="8" y="0.5" width="5.5" height="5.5" rx="1"/>
            <rect x="0.5" y="8" width="5.5" height="5.5" rx="1"/><rect x="8" y="8" width="5.5" height="5.5" rx="1"/>
          </svg>
        </button>
        <button class="view-btn" id="vlBtn" title="列表" onclick="setView('list')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2">
            <line x1="0" y1="2.5" x2="14" y2="2.5"/>
            <line x1="0" y1="7" x2="14" y2="7"/>
            <line x1="0" y1="11.5" x2="14" y2="11.5"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="result-info" id="resultInfo"></div>
    <div id="productArea"></div>

  </main>
</div>

<!-- ══ 購物車面板 ══ -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cartPanel">
  <div class="cart-head">
    <h3>購物車</h3>
    <button class="btn-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-summary" id="cartSummary"></div>
    <button class="btn-order" id="btnOrder" onclick="goOrder()" disabled>確認訂單內容</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  設定
// ══════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwQE0fz5u1mvUctWmA2UgDf5V5kDJljmH4whhgZ5LZClNjbxr_dxRPyyvNmNTCSAP5xSg/exec';

// ── 狀態 ──
let allProducts = [];
let cart        = {};   // { productId: qty }
let curCat      = 'all';
let curView     = 'grid';

// ══════════════════════════════════════════
//  初始化
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  loadProducts();
});

function checkAuth() {
  const dealer = JSON.parse(sessionStorage.getItem('dealer') || 'null');
  if (!dealer) { window.location.href = 'index.html'; return; }
  document.getElementById('dealerName').textContent = dealer.name || dealer.account;
}

function logout() {
  sessionStorage.removeItem('dealer');
  window.location.href = 'index.html';
}

// ══════════════════════════════════════════
//  載入商品（GAS API → 備用假資料）
// ══════════════════════════════════════════
async function loadProducts() {
  showSkeleton();
  try {
    const dealer = JSON.parse(sessionStorage.getItem('dealer'));
    const res    = await fetch(GAS_URL + '?action=getProducts&token=' + dealer.token);
    const data   = await res.json();
    if (data.success) {
      allProducts = data.products;
    } else {
      allProducts = getMockProducts();
    }
  } catch {
    allProducts = getMockProducts();
  }
  buildCatList();
  renderProducts();
}

// 開發時使用的假資料（GAS 串接前）
function getMockProducts() {
  return [
    { id:'P001', name:'凍乾榴槤酥', cat:'凍乾系列', unit:'袋', price:280, moq:10, stock:'充足', icon:'🥭', badge:'hot' },
    { id:'P002', name:'凍乾山竹片', cat:'凍乾系列', unit:'袋', price:320, moq:6,  stock:'充足', icon:'🫐', badge:'new' },
    { id:'P003', name:'凍乾芒果片', cat:'凍乾系列', unit:'袋', price:260, moq:12, stock:'充足', icon:'🍊', badge:'' },
    { id:'P004', name:'凍乾火龍果丁', cat:'凍乾系列', unit:'袋', price:290, moq:10, stock:'少量', icon:'🍎', badge:'' },
    { id:'P005', name:'軟乾龍眼',    cat:'軟乾系列', unit:'包', price:180, moq:24, stock:'少量', icon:'🍇', badge:'' },
    { id:'P006', name:'軟乾紅毛丹',  cat:'軟乾系列', unit:'包', price:220, moq:12, stock:'充足', icon:'🍓', badge:'hot' },
    { id:'P007', name:'軟乾百香果條',cat:'軟乾系列', unit:'包', price:160, moq:24, stock:'缺貨', icon:'🍋', badge:'' },
    { id:'P008', name:'軟乾鳳梨條',  cat:'軟乾系列', unit:'包', price:190, moq:12, stock:'充足', icon:'🍍', badge:'new' },
    { id:'P009', name:'凍乾水果禮盒 A', cat:'禮盒組', unit:'盒', price:980, moq:3, stock:'充足', icon:'🎁', badge:'' },
    { id:'P010', name:'精選軟乾禮盒 B', cat:'禮盒組', unit:'盒', price:760, moq:6, stock:'少量', icon:'🎀', badge:'' },
    { id:'P011', name:'綜合果乾禮盒 C', cat:'禮盒組', unit:'盒', price:850, moq:3, stock:'充足', icon:'🧺', badge:'new' },
  ];
}

// ══════════════════════════════════════════
//  分類側邊欄
// ══════════════════════════════════════════
function buildCatList() {
  const cats = ['all', ...new Set(allProducts.map(p => p.cat))];
  const el   = document.getElementById('catList');

  el.innerHTML = cats.map(c => {
    const count = c === 'all' ? allProducts.length : allProducts.filter(p => p.cat === c).length;
    const label = c === 'all' ? '全部商品' : c;
    return `<button class="cat-item ${c === curCat ? 'active' : ''}"
              onclick="setCat('${c}')">
              ${label}
              <span class="cat-count">${count}</span>
            </button>`;
  }).join('<div class="sidebar-sep"></div>');
}

function setCat(cat) {
  curCat = cat;
  buildCatList();
  renderProducts();
}

// ══════════════════════════════════════════
//  渲染商品
// ══════════════════════════════════════════
function setView(v) {
  curView = v;
  document.getElementById('vgBtn').classList.toggle('active', v === 'grid');
  document.getElementById('vlBtn').classList.toggle('active', v === 'list');
  renderProducts();
}

function getFiltered() {
  const q    = document.getElementById('searchInput').value.trim().toLowerCase();
  const sort = document.getElementById('sortSelect').value;

  let list = allProducts.filter(p => {
    const matchCat  = curCat === 'all' || p.cat === curCat;
    const matchText = !q || p.name.toLowerCase().includes(q) || (p.cat || '').toLowerCase().includes(q);
    return matchCat && matchText;
  });

  if (sort === 'price_asc')  list.sort((a,b) => a.price - b.price);
  if (sort === 'price_desc') list.sort((a,b) => b.price - a.price);
  if (sort === 'name_asc')   list.sort((a,b) => a.name.localeCompare(b.name, 'zh-TW'));

  return list;
}

function renderProducts() {
  const list = getFiltered();
  const area = document.getElementById('productArea');
  const info = document.getElementById('resultInfo');

  info.textContent = `共 ${list.length} 項商品`;

  if (!list.length) {
    area.innerHTML = '<div class="empty-state"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#9A8A7A" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>找不到符合條件的商品</p></div>';
    return;
  }

  area.innerHTML = curView === 'grid' ? renderGrid(list) : renderList(list);
}

function stockClass(s) {
  if (s === '充足') return 'stock-ok';
  if (s === '少量') return 'stock-low';
  return 'stock-out';
}

function stockText(s) {
  if (s === '充足') return '庫存充足';
  if (s === '少量') return '庫存少量';
  return '暫時缺貨';
}

function imgHtml(p, size) {
  if (p.imgUrl) return `<img src="${p.imgUrl}" alt="${p.name}" loading="lazy">`;
  return `<span style="font-size:${size}px">${p.icon || '📦'}</span>`;
}

function badgeHtml(b) {
  if (!b) return '';
  const cls = b === 'new' ? 'badge-new' : 'badge-hot';
  const txt = b === 'new' ? '新品' : '熱銷';
  return `<span class="card-badge ${cls}">${txt}</span>`;
}

// 卡片視圖
function renderGrid(list) {
  return `<div class="grid-view">` + list.map(p => {
    const disabled = p.stock === '缺貨' ? 'disabled' : '';
    const scls     = stockClass(p.stock);
    return `
    <div class="product-card">
      <div class="card-img">
        ${imgHtml(p, 40)}
        ${badgeHtml(p.badge)}
      </div>
      <div class="card-body">
        <div class="card-cat">${p.cat}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-price">NT$${p.price.toLocaleString()} <span>/ ${p.unit}</span></div>
        <div class="card-moq">最低訂量：${p.moq} ${p.unit}</div>
        <span class="stock-pill ${scls}"><span class="stock-dot"></span>${stockText(p.stock)}</span>
        <div class="card-footer">
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="adjustQty('${p.id}',${-p.moq})">−</button>
            <input class="qty-input" id="qi_${p.id}" type="number" value="0" min="0" step="${p.moq}">
            <button class="qty-btn" onclick="adjustQty('${p.id}',${p.moq})">+</button>
          </div>
          <button class="btn-add" id="ab_${p.id}" onclick="addToCart('${p.id}')" ${disabled}>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>
            加入購物車
          </button>
        </div>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

// 列表視圖
function renderList(list) {
  return `<div class="list-view">
    <div class="list-header">
      <span></span>
      <span>商品名稱</span>
      <span>庫存</span>
      <span>單價 / 最低訂量</span>
      <span></span>
      <span>數量與加入</span>
    </div>
    ${list.map(p => {
      const disabled = p.stock === '缺貨' ? 'disabled' : '';
      const scls     = stockClass(p.stock);
      return `
      <div class="list-row">
        <div class="list-icon">${imgHtml(p, 20)}</div>
        <div>
          <div class="list-name">${p.name} ${p.badge ? `<span class="card-badge ${p.badge === 'new' ? 'badge-new' : 'badge-hot'}" style="position:static;font-size:10px;padding:2px 6px;border-radius:10px">${p.badge === 'new' ? '新品' : '熱銷'}</span>` : ''}</div>
          <div class="list-sub">${p.cat}</div>
        </div>
        <div><span class="stock-pill ${scls}" style="margin:0"><span class="stock-dot"></span>${stockText(p.stock)}</span></div>
        <div>
          <div class="list-price">NT$${p.price.toLocaleString()}</div>
          <div class="list-moq">/ ${p.unit} &nbsp;最低 ${p.moq} ${p.unit}</div>
        </div>
        <div></div>
        <div class="list-qty-ctrl">
          <button class="qty-btn" onclick="adjustQty('${p.id}',${-p.moq})">−</button>
          <input class="qty-input" id="qi_${p.id}" type="number" value="0" min="0" step="${p.moq}">
          <button class="qty-btn" onclick="adjustQty('${p.id}',${p.moq})">+</button>
          <button class="btn-add" id="ab_${p.id}" onclick="addToCart('${p.id}')" ${disabled} style="width:58px;height:28px;font-size:11px">加入</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ══════════════════════════════════════════
//  購物車邏輯
// ══════════════════════════════════════════
function adjustQty(id, delta) {
  const inp = document.getElementById('qi_' + id);
  if (!inp) return;
  const p = allProducts.find(x => x.id === id);
  if (!p) return;
  let v = Math.max(0, (parseInt(inp.value) || 0) + delta);
  inp.value = v;
}

function addToCart(id) {
  const inp = document.getElementById('qi_' + id);
  const qty = parseInt(inp?.value) || 0;
  const p   = allProducts.find(x => x.id === id);
  if (!p) return;

  if (qty === 0) { showToast('請輸入訂購數量'); return; }
  if (qty < p.moq) { showToast(`最低訂量為 ${p.moq} ${p.unit}`); return; }
  if (qty % p.moq !== 0) { showToast(`數量須為 ${p.moq} 的倍數`); return; }

  cart[id] = (cart[id] || 0) + qty;
  if (inp) inp.value = 0;

  const btn = document.getElementById('ab_' + id);
  if (btn) {
    btn.textContent = '已加入 ✓';
    btn.classList.add('added');
    setTimeout(() => {
      btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg> 加入購物車';
      btn.classList.remove('added');
    }, 1200);
  }

  updateCartUI();
  showToast(`已加入 ${p.name} × ${qty}`);
}

function removeFromCart(id) {
  delete cart[id];
  updateCartUI();
  renderCartPanel();
}

function updateCartUI() {
  const totalItems = Object.values(cart).reduce((s,v) => s + (v > 0 ? 1 : 0), 0);
  document.getElementById('cartBadge').textContent = totalItems;
}

function openCart() {
  renderCartPanel();
  document.getElementById('cartOverlay').classList.add('open');
  document.getElementById('cartPanel').classList.add('open');
}

function closeCart() {
  document.getElementById('cartOverlay').classList.remove('open');
  document.getElementById('cartPanel').classList.remove('open');
}

function renderCartPanel() {
  const el     = document.getElementById('cartItems');
  const sumEl  = document.getElementById('cartSummary');
  const btnOrd = document.getElementById('btnOrder');

  const entries = Object.entries(cart).filter(([,q]) => q > 0);

  if (!entries.length) {
    el.innerHTML = '<div class="cart-empty"><svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#9A8A7A" stroke-width="1.2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><p>購物車是空的</p></div>';
    sumEl.innerHTML = '';
    btnOrd.disabled = true;
    return;
  }

  let totalAmt = 0;
  let totalQty = 0;
  el.innerHTML = entries.map(([id, qty]) => {
    const p = allProducts.find(x => x.id === id);
    if (!p) return '';
    const sub = p.price * qty;
    totalAmt += sub;
    totalQty += qty;
    return `<div class="cart-item">
      <div class="ci-icon">${imgHtml(p, 20)}</div>
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-sub">${qty} ${p.unit} × NT$${p.price.toLocaleString()}</div>
      </div>
      <div class="ci-right">
        <div class="ci-price">NT$${sub.toLocaleString()}</div>
        <button class="ci-remove" onclick="removeFromCart('${id}')">移除</button>
      </div>
    </div>`;
  }).join('');

  sumEl.innerHTML = `
    <div class="sum-row"><span>共 ${entries.length} 種商品</span><span>${totalQty} 件</span></div>
    <div class="sum-row total"><span>合計金額</span><span>NT$${totalAmt.toLocaleString()}</span></div>`;

  btnOrd.disabled = false;
}

// Phase 2：前往下單確認頁
function goOrder() {
  const entries = Object.entries(cart).filter(([,q]) => q > 0);
  if (!entries.length) { showToast('請先加入商品'); return; }
  sessionStorage.setItem('pendingCart', JSON.stringify(cart));
  sessionStorage.setItem('cachedProducts', JSON.stringify(allProducts));
  window.location.href = 'order.html';
}

// ══════════════════════════════════════════
//  工具
// ══════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

function showSkeleton() {
  const area = document.getElementById('productArea');
  area.innerHTML = '<div class="grid-view">' +
    Array(6).fill('<div class="product-card"><div class="card-img skeleton" style="aspect-ratio:1"></div><div class="card-body"><div class="skeleton" style="height:12px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:16px;margin-bottom:6px"></div><div class="skeleton" style="height:12px;width:40%"></div></div></div>').join('') +
    '</div>';
}
</script>
</body>
</html>
