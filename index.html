<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國際柑仔店 經銷商訂購系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --brand:    #C85C2A;
    --brand-lt: #F5EDE6;
    --brand-dk: #8C3D18;
    --ink:      #1A1410;
    --ink-2:    #5A4A3A;
    --ink-3:    #9A8A7A;
    --surface:  #FDFAF7;
    --line:     #E8DDD4;
    --white:    #FFFFFF;
    --danger:   #C0392B;
    --radius:   10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--surface);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 左側品牌區 */
  .layout {
    display: flex;
    width: 100%;
    min-height: 100vh;
  }

  .brand-panel {
    width: 45%;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 52px;
    position: relative;
    overflow: hidden;
  }

  .brand-panel::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: var(--brand);
    opacity: 0.12;
  }

  .brand-panel::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: var(--brand);
    opacity: 0.08;
  }

  .brand-logo {
    position: relative;
    z-index: 1;
  }

  .brand-logo .logo-mark {
    width: 48px; height: 48px;
    background: var(--brand);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    font-size: 22px;
  }

  .brand-logo h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.5;
    letter-spacing: 0.04em;
  }

  .brand-logo p {
    font-size: 13px;
    color: var(--ink-3);
    margin-top: 6px;
    letter-spacing: 0.06em;
  }

  .brand-tagline {
    position: relative;
    z-index: 1;
  }

  .brand-tagline blockquote {
    font-family: 'Noto Serif TC', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--white);
    line-height: 1.7;
    opacity: 0.85;
  }

  .brand-tagline blockquote span {
    color: var(--brand);
    opacity: 1;
  }

  .brand-tagline cite {
    display: block;
    font-size: 12px;
    color: var(--ink-3);
    font-style: normal;
    letter-spacing: 0.08em;
    margin-top: 16px;
  }

  .brand-features {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .feat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-3);
  }

  .feat-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brand);
    flex-shrink: 0;
  }

  /* 右側登入區 */
  .login-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 52px;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
  }

  .login-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 14px;
    color: var(--ink-3);
    margin-bottom: 36px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.06em;
    margin-bottom: 7px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 14px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(200,92,42,0.1);
  }

  .err-msg {
    display: none;
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
  }

  .err-msg.show { display: block; }

  .btn-login {
    width: 100%;
    height: 48px;
    background: var(--brand);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .btn-login:hover { background: var(--brand-dk); }
  .btn-login:active { transform: scale(0.99); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .btn-login.loading .spinner { display: block; }
  .btn-login.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .login-footer {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    line-height: 1.8;
  }

  /* 全域錯誤橫幅 */
  .alert-bar {
    display: none;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--danger);
    margin-bottom: 20px;
    align-items: center;
    gap: 8px;
  }
  .alert-bar.show { display: flex; }

  /* RWD */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .brand-panel {
      width: 100%; min-height: auto;
      padding: 32px 28px;
      flex-direction: row;
      align-items: center;
      gap: 20px;
    }
    .brand-tagline, .brand-features { display: none; }
    .brand-logo { margin-bottom: 0; }
    .brand-logo h1 { font-size: 17px; }
    .login-panel { padding: 36px 28px; }
  }

  /* Google 登入按鈕 */
  .btn-google {
    width: 100%;
    height: 46px;
    background: var(--white);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: all 0.2s;
    margin-bottom: 16px;
  }
  .btn-google:hover { border-color: #4285F4; box-shadow: 0 0 0 3px rgba(66,133,244,0.1); }
  .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
    font-size: 12px; color: var(--ink-3);
  }
  .divider::before, .divider::after {
    content: ''; flex: 1;
    height: 1px; background: var(--line);
  }

  /* 申請帳號連結 */
  .apply-link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--ink-3);
  }
  .apply-link a {
    color: var(--brand);
    text-decoration: none;
    cursor: pointer;
  }
  .apply-link a:hover { text-decoration: underline; }

  /* 申請帳號 Modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(26,20,16,0.5);
    z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--white);
    border-radius: 14px;
    width: 100%; max-width: 400px;
    margin: 16px;
    overflow: hidden;
  }
  .modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Noto Serif TC', serif;
    font-size: 16px; font-weight: 600;
  }
  .modal-close-btn {
    width: 28px; height: 28px;
    background: var(--surface); border: none; border-radius: 6px;
    cursor: pointer; font-size: 16px; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
  }
  .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg label { font-size: 12px; font-weight: 500; color: var(--ink-2); letter-spacing: .05em; }
  .fg input, .fg textarea {
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink); outline: none; transition: border-color .2s;
  }
  .fg input:focus, .fg textarea:focus { border-color: var(--brand); }
  .fg textarea { resize: vertical; min-height: 70px; }
  .btn-primary-sm {
    padding: 9px 20px; background: var(--brand); color: var(--white);
    border: none; border-radius: 8px; font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif; cursor: pointer;
    transition: background .2s;
  }
  .btn-primary-sm:hover { background: var(--brand-dk); }
  .btn-cancel-sm {
    padding: 9px 20px; background: transparent;
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; color: var(--ink-2);
  }
  .success-msg {
    text-align: center; padding: 20px;
    font-size: 14px; color: var(--success);
  }
</style>
</head>
<body>

<div class="layout">

  <!-- 左側品牌 -->
  <div class="brand-panel">
    <div class="brand-logo">
      <div class="logo-mark">🍊</div>
      <h1>國際柑仔店<br>經銷商訂購系統</h1>
      <p>MASCOT INTERNATIONAL · DEALER PORTAL</p>
    </div>

    <div class="brand-tagline">
      <blockquote>
        來自泰國的<br>
        <span>天然好滋味</span>，<br>
        直送您的門市。
      </blockquote>
      <cite>僅供授權經銷商使用</cite>
    </div>

    <div class="brand-features">
      <div class="feat-item"><span class="feat-dot"></span>即時瀏覽完整商品目錄</div>
      <div class="feat-item"><span class="feat-dot"></span>線上填寫訂單，告別電話傳真</div>
      <div class="feat-item"><span class="feat-dot"></span>隨時查詢歷史訂單紀錄</div>
    </div>
  </div>

  <!-- 右側登入 -->
  <div class="login-panel">
    <div class="login-box">
      <h2 class="login-title">經銷商登入</h2>
      <p class="login-sub">請輸入您的帳號與密碼</p>

      <div class="alert-bar" id="alertBar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2"/>
          <line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8" cy="11" r="0.7" fill="currentColor"/>
        </svg>
        <span id="alertText">帳號或密碼錯誤，請重新輸入。</span>
      </div>

      <!-- Google 登入 -->
      <button type="button" class="btn-google" id="googleLoginBtn" onclick="doGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        用 Google 帳號登入
      </button>

      <div class="divider">或使用帳號密碼</div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label for="account">帳號</label>
          <input type="text" id="account" placeholder="請輸入帳號" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">密碼</label>
          <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">登入</span>
        </button>
      </form>

      <div class="apply-link">
        尚未有帳號？<a onclick="openApplyModal()">申請經銷商帳號</a>
      </div>

      <div class="login-footer">
        帳號由管理員建立，如需協助請聯繫業務專員<br>
        © 2025 國際柑仔店 Mascot International
      </div>
    </div>
  </div>

</div>


<!-- 申請帳號 Modal -->
<div class="modal-overlay" id="applyModal">
  <div class="modal-box">
    <div class="modal-head">
      申請經銷商帳號
      <button class="modal-close-btn" onclick="closeApplyModal()">✕</button>
    </div>
    <div id="applyContent">
      <div class="modal-body">
        <p style="font-size:13px;color:var(--ink-3)">
          申請後由管理員審核，核准後即可用 Google 帳號登入。
        </p>
        <div class="fg">
          <label>Gmail 地址 *</label>
          <input type="text" id="applyGmail" placeholder="your@gmail.com">
        </div>
        <div class="fg">
          <label>公司 / 商行名稱 *</label>
          <input type="text" id="applyName" placeholder="XX 食品行">
        </div>
        <div class="fg">
          <label>申請原因</label>
          <textarea id="applyReason" placeholder="簡述您的業務需求..."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-cancel-sm" onclick="closeApplyModal()">取消</button>
        <button class="btn-primary-sm" id="applySubmitBtn" onclick="submitApply()">送出申請</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ── 版本：index.html v2.3.0 ──
  // ── 新增 Google 登入 + 申請帳號（比照 CRM）──
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzbrEhEC44y6mA-ThVDklFrvZs_HlagR4si8UgE7MRWtE_1GXSTU0Q-QiI7GxcFO4SfmA/exec';

  // ── Google Identity Services (GIS) ──
  // GAS 方法 B：開新視窗跳到 GAS OAuth 端點取得 Gmail
  async function doGoogleLogin() {
    const btn = document.getElementById('googleLoginBtn');
    btn.disabled = true;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg> 連接中...';

    try {
      // 開啟 Google 帳號選擇視窗（透過 GAS OAuth）
      const oauthUrl = GAS_URL + '?action=getGoogleUser';
      const width = 500, height = 600;
      const left  = (window.screen.width - width) / 2;
      const top   = (window.screen.height - height) / 2;
      const popup = window.open(oauthUrl, 'googleLogin',
        `width=${width},height=${height},left=${left},top=${top}`);

      // 等待 popup 回傳 Gmail
      const gmail = await waitForPopup(popup);
      if (!gmail) throw new Error('Google 登入被取消');

      // 用 Gmail 呼叫 GAS loginWithGoogle
      const url  = GAS_URL + '?action=loginWithGoogle&gmail=' + encodeURIComponent(gmail) + '&name=' + encodeURIComponent(gmail.split('@')[0]);
      const res  = await fetch(url);
      const data = await res.json();

      if (data.success) {
        sessionStorage.setItem('dealer', JSON.stringify({
          account : data.account,
          name    : data.name,
          role    : data.role,
          token   : data.token,
        }));
        if (data.role === 'admin') {
          window.location.href = 'admin/index.html';
        } else {
          window.location.href = 'catalog.html';
        }
      } else {
        // 未授權 → 引導申請
        if (data.message && data.message.includes('申請')) {
          if (confirm(data.message + '

是否立即申請帳號？')) {
            document.getElementById('applyGmail').value = gmail;
            openApplyModal();
          }
        } else {
          showAlert(data.message || 'Google 登入失敗');
        }
      }
    } catch (err) {
      showAlert('Google 登入失敗：' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg> 用 Google 帳號登入';
    }
  }

  function waitForPopup(popup) {
    return new Promise((resolve) => {
      const check = setInterval(() => {
        try {
          if (popup.closed) { clearInterval(check); resolve(null); return; }
          const url = popup.location.href;
          if (url.includes('gmail=')) {
            const gmail = decodeURIComponent(url.split('gmail=')[1].split('&')[0]);
            popup.close();
            clearInterval(check);
            resolve(gmail);
          }
        } catch(e) { /* cross-origin，繼續等 */ }
      }, 500);
      setTimeout(() => { clearInterval(check); if (!popup.closed) popup.close(); resolve(null); }, 120000);
    });
  }

  async function doLogin(e) {
    e.preventDefault();
    const btn     = document.getElementById('loginBtn');
    const alertEl = document.getElementById('alertBar');
    const account  = document.getElementById('account').value.trim();
    const password = document.getElementById('password').value;
    alertEl.classList.remove('show');
    btn.disabled = true; btn.classList.add('loading');
    try {
      const url = GAS_URL + '?action=login&account=' + encodeURIComponent(account) + '&password=' + encodeURIComponent(password);
      const res  = await fetch(url);
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem('dealer', JSON.stringify({ account: data.account, name: data.name, role: data.role, token: data.token }));
        if (data.role === 'admin') window.location.href = 'admin/index.html';
        else window.location.href = 'catalog.html';
      } else {
        showAlert(data.message || '帳號或密碼錯誤，請重新輸入。');
      }
    } catch (err) {
      showAlert('連線失敗，請稍後再試。（' + err.message + '）');
    } finally {
      btn.disabled = false; btn.classList.remove('loading');
    }
  }

  function showAlert(msg) {
    document.getElementById('alertText').textContent = msg;
    document.getElementById('alertBar').classList.add('show');
  }

  // ── 申請帳號 ──
  function openApplyModal()  { document.getElementById('applyModal').classList.add('open'); }
  function closeApplyModal() { document.getElementById('applyModal').classList.remove('open'); }

  async function submitApply() {
    const gmail  = document.getElementById('applyGmail').value.trim();
    const name   = document.getElementById('applyName').value.trim();
    const reason = document.getElementById('applyReason').value.trim();
    if (!gmail) { alert('請填寫 Gmail 地址'); return; }
    if (!name)  { alert('請填寫公司名稱'); return; }

    const btn = document.getElementById('applySubmitBtn');
    btn.disabled = true; btn.textContent = '送出中...';
    try {
      const url  = GAS_URL + '?action=applyAccount&gmail=' + encodeURIComponent(gmail) + '&name=' + encodeURIComponent(name) + '&reason=' + encodeURIComponent(reason);
      const res  = await fetch(url);
      const data = await res.json();
      if (data.success) {
        document.getElementById('applyContent').innerHTML = '<div class="success-msg"><svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="#2E7D52" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg><p style="margin-top:12px">' + data.message + '</p></div>';
      } else {
        alert(data.message || '送出失敗');
        btn.disabled = false; btn.textContent = '送出申請';
      }
    } catch(err) {
      alert('連線失敗：' + err.message);
      btn.disabled = false; btn.textContent = '送出申請';
    }
  }

  if (sessionStorage.getItem('dealer')) {
    const d = JSON.parse(sessionStorage.getItem('dealer'));
    window.location.href = d.role === 'admin' ? 'admin/index.html' : 'catalog.html';
  }
</script>
</body>
</html>
