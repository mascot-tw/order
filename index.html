<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國際柑仔店 經銷商訂購系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');

  :root {
    --brand:    #C85C2A;
    --brand-lt: #F5EDE6;
    --brand-dk: #8C3D18;
    --ink:      #1A1410;
    --ink-2:    #5A4A3A;
    --ink-3:    #9A8A7A;
    --surface:  #FDFAF7;
    --line:     #E8DDD4;
    --white:    #FFFFFF;
    --danger:   #C0392B;
    --radius:   10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--surface);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 左側品牌區 */
  .layout {
    display: flex;
    width: 100%;
    min-height: 100vh;
  }

  .brand-panel {
    width: 45%;
    background: var(--ink);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px 52px;
    position: relative;
    overflow: hidden;
  }

  .brand-panel::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: var(--brand);
    opacity: 0.12;
  }

  .brand-panel::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 240px; height: 240px;
    border-radius: 50%;
    background: var(--brand);
    opacity: 0.08;
  }

  .brand-logo {
    position: relative;
    z-index: 1;
  }

  .brand-logo .logo-mark {
    width: 48px; height: 48px;
    background: var(--brand);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    font-size: 22px;
  }

  .brand-logo h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--white);
    line-height: 1.5;
    letter-spacing: 0.04em;
  }

  .brand-logo p {
    font-size: 13px;
    color: var(--ink-3);
    margin-top: 6px;
    letter-spacing: 0.06em;
  }

  .brand-tagline {
    position: relative;
    z-index: 1;
  }

  .brand-tagline blockquote {
    font-family: 'Noto Serif TC', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--white);
    line-height: 1.7;
    opacity: 0.85;
  }

  .brand-tagline blockquote span {
    color: var(--brand);
    opacity: 1;
  }

  .brand-tagline cite {
    display: block;
    font-size: 12px;
    color: var(--ink-3);
    font-style: normal;
    letter-spacing: 0.08em;
    margin-top: 16px;
  }

  .brand-features {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .feat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--ink-3);
  }

  .feat-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brand);
    flex-shrink: 0;
  }

  /* 右側登入區 */
  .login-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 52px;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
  }

  .login-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 14px;
    color: var(--ink-3);
    margin-bottom: 36px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    letter-spacing: 0.06em;
    margin-bottom: 7px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0 14px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: var(--white);
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(200,92,42,0.1);
  }

  .err-msg {
    display: none;
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
  }

  .err-msg.show { display: block; }

  .btn-login {
    width: 100%;
    height: 48px;
    background: var(--brand);
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.2s, transform 0.1s;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .btn-login:hover { background: var(--brand-dk); }
  .btn-login:active { transform: scale(0.99); }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .btn-login.loading .spinner { display: block; }
  .btn-login.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .login-footer {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
    line-height: 1.8;
  }

  /* 全域錯誤橫幅 */
  .alert-bar {
    display: none;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--danger);
    margin-bottom: 20px;
    align-items: center;
    gap: 8px;
  }
  .alert-bar.show { display: flex; }

  /* RWD */
  @media (max-width: 768px) {
    .layout { flex-direction: column; }
    .brand-panel {
      width: 100%; min-height: auto;
      padding: 32px 28px;
      flex-direction: row;
      align-items: center;
      gap: 20px;
    }
    .brand-tagline, .brand-features { display: none; }
    .brand-logo { margin-bottom: 0; }
    .brand-logo h1 { font-size: 17px; }
    .login-panel { padding: 36px 28px; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- 左側品牌 -->
  <div class="brand-panel">
    <div class="brand-logo">
      <div class="logo-mark">🍊</div>
      <h1>國際柑仔店<br>經銷商訂購系統</h1>
      <p>MASCOT INTERNATIONAL · DEALER PORTAL</p>
    </div>

    <div class="brand-tagline">
      <blockquote>
        來自泰國的<br>
        <span>天然好滋味</span>，<br>
        直送您的門市。
      </blockquote>
      <cite>僅供授權經銷商使用</cite>
    </div>

    <div class="brand-features">
      <div class="feat-item"><span class="feat-dot"></span>即時瀏覽完整商品目錄</div>
      <div class="feat-item"><span class="feat-dot"></span>線上填寫訂單，告別電話傳真</div>
      <div class="feat-item"><span class="feat-dot"></span>隨時查詢歷史訂單紀錄</div>
    </div>
  </div>

  <!-- 右側登入 -->
  <div class="login-panel">
    <div class="login-box">
      <h2 class="login-title">經銷商登入</h2>
      <p class="login-sub">請輸入您的帳號與密碼</p>

      <div class="alert-bar" id="alertBar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2"/>
          <line x1="8" y1="5" x2="8" y2="8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8" cy="11" r="0.7" fill="currentColor"/>
        </svg>
        <span id="alertText">帳號或密碼錯誤，請重新輸入。</span>
      </div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label for="account">帳號</label>
          <input type="text" id="account" placeholder="請輸入帳號" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">密碼</label>
          <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">登入</span>
        </button>
      </form>

      <div class="login-footer">
        帳號由管理員建立，如需協助請聯繫業務專員<br>
        © 2025 國際柑仔店 Mascot International
      </div>
    </div>
  </div>

</div>

<script>
  // ── 版本：index2.html v1.1.0 ──
  // ── 修正：登入改為 GET 請求，解決 GitHub Pages CORS 問題 ──
  const GAS_URL = 'https://script.google.com/macros/s/AKfycby4tqY0WJvOKsF4dYTl9EwnSegNUlIopEcJSZA67HlGAwyeR4yo0mTjrCaCHoNzXyiVng/exec';

  async function doLogin(e) {
    e.preventDefault();
    const btn     = document.getElementById('loginBtn');
    const alertEl = document.getElementById('alertBar');
    const account  = document.getElementById('account').value.trim();
    const password = document.getElementById('password').value;

    alertEl.classList.remove('show');
    btn.disabled = true;
    btn.classList.add('loading');

    try {
      // ── GET 請求（避免 CORS preflight）──
      const url = GAS_URL
        + '?action=login'
        + '&account=' + encodeURIComponent(account)
        + '&password=' + encodeURIComponent(password);

      const res  = await fetch(url, { method: 'GET' });
      const data = await res.json();

      if (data.success) {
        sessionStorage.setItem('dealer', JSON.stringify({
          account : data.account,
          name    : data.name,
          token   : data.token,
        }));
        window.location.href = 'catalog.html';
      } else {
        showAlert(data.message || '帳號或密碼錯誤，請重新輸入。');
      }
    } catch (err) {
      showAlert('連線失敗，請稍後再試。（' + err.message + '）');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  function showAlert(msg) {
    document.getElementById('alertText').textContent = msg;
    document.getElementById('alertBar').classList.add('show');
  }

  // 若已登入則直接跳轉
  if (sessionStorage.getItem('dealer')) {
    window.location.href = 'catalog.html';
  }
</script>
</body>
</html>
