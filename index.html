<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國際柑仔店 經銷商訂購系統</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');
:root{
  --brand:#C85C2A;--brand-lt:#F5EDE6;--brand-dk:#8C3D18;
  --ink:#1A1410;--ink-2:#5A4A3A;--ink-3:#9A8A7A;
  --surface:#FDFAF7;--line:#E8DDD4;--white:#FFFFFF;
  --danger:#C0392B;--radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--surface);color:var(--ink);min-height:100vh;display:flex}

/* ── 左側圖塊 ── */
.brand-panel{width:48%;background:var(--ink);position:relative;overflow:hidden;min-height:100vh;flex-shrink:0}
.block-grid{position:absolute;inset:0;display:grid;gap:2px}
.block-img{background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity .4s}
/* 版面 A */
.layout-A .block-grid{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr}
.layout-A .blk-1{grid-row:1/3}
/* 版面 B */
.layout-B .block-grid{grid-template-rows:1.3fr 1fr;grid-template-columns:1fr 1fr 1fr}
.layout-B .blk-1{grid-column:1/4}
/* 版面 C */
.layout-C .block-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
/* 版面 D */
.layout-D .block-grid{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr}
.layout-D .blk-1{grid-row:1/3}

.brand-top{position:absolute;top:0;left:0;right:0;padding:28px 32px;z-index:10;display:flex;align-items:center;gap:12px}
.brand-logo{width:40px;height:40px;background:var(--brand);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand-name{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:600;color:var(--white);letter-spacing:.04em;line-height:1.4}
.brand-sub{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.1em}
.brand-btm{position:absolute;bottom:0;left:0;right:0;padding:24px 32px;z-index:10;background:linear-gradient(to top,rgba(26,20,16,.9) 0%,transparent 100%)}
.tagline{font-family:'Noto Serif TC',serif;font-size:18px;color:var(--white);line-height:1.7;opacity:.9}
.tagline span{color:var(--brand)}
.tagline-sub{font-size:12px;color:rgba(255,255,255,.5);margin-top:6px}

/* ── 右側登入 ── */
.login-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px}
.login-box{width:100%;max-width:360px}
.login-title{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:600;color:var(--ink);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--ink-3);margin-bottom:28px}

.btn-google{width:100%;height:46px;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);font-size:14px;font-family:'Noto Sans TC',sans-serif;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;margin-bottom:16px}
.btn-google:hover{border-color:#4285F4;box-shadow:0 0 0 3px rgba(66,133,244,.1)}
.btn-google:disabled{opacity:.5;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:12px;color:var(--ink-3)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}

.form-group{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:.05em;margin-bottom:6px}
input[type=text],input[type=password]{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);background:var(--white);outline:none;transition:border-color .2s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,92,42,.1)}
.alert{display:none;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:13px;color:var(--danger);margin-bottom:16px;align-items:center;gap:8px}
.alert.show{display:flex}
.btn-login{width:100%;height:46px;background:var(--brand);color:var(--white);border:none;border-radius:var(--radius);font-size:15px;font-family:'Noto Sans TC',sans-serif;font-weight:500;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn-login:hover{background:var(--brand-dk)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn-login.loading .spinner{display:block}
.btn-login.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.apply-link{text-align:center;margin-top:16px;font-size:13px;color:var(--ink-3)}
.apply-link a{color:var(--brand);text-decoration:none;cursor:pointer}
.apply-link a:hover{text-decoration:underline}
.login-footer{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);text-align:center;line-height:1.8}

/* 申請 Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(26,20,16,.45);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:400px;margin:16px;overflow:hidden}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:600}
.modal-close{width:28px;height:28px;background:var(--surface);border:none;border-radius:6px;cursor:pointer;font-size:16px;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:12px;font-weight:500;color:var(--ink-2)}
.fg input,.fg textarea{border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);outline:none;transition:border-color .2s}
.fg input:focus,.fg textarea:focus{border-color:var(--brand)}
.fg textarea{resize:vertical;min-height:70px}
.btn-primary{padding:9px 20px;background:var(--brand);color:var(--white);border:none;border-radius:8px;font-size:14px;font-family:'Noto Sans TC',sans-serif;cursor:pointer}
.btn-cancel{padding:9px 20px;background:transparent;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:'Noto Sans TC',sans-serif;cursor:pointer;color:var(--ink-2)}
.success-msg{text-align:center;padding:20px;font-size:14px;color:#2E7D52}

@media(max-width:768px){
  body{flex-direction:column}
  .brand-panel{width:100%;min-height:200px}
  .block-grid{position:relative;height:200px}
  .brand-top{padding:16px 20px}
  .brand-btm{padding:14px 20px}
  .tagline{font-size:14px}
  .login-panel{padding:32px 24px}
}
</style>
</head>
<body>

<!-- 左側圖塊 -->
<div class="brand-panel layout-A" id="brandPanel">
  <div class="block-grid" id="blockGrid"></div>
  <div class="brand-top">
    <div class="brand-logo">🍊</div>
    <div>
      <div class="brand-name">國際柑仔店</div>
      <div class="brand-sub">MASCOT INTERNATIONAL · DEALER PORTAL</div>
    </div>
  </div>
  <div class="brand-btm">
    <div class="tagline" id="taglineEl">精選日系生活好物</div>
    <div class="tagline-sub" id="taglineSubEl">嚴選日本生活百貨，直送您的門市</div>
  </div>
</div>

<!-- 右側登入 -->
<div class="login-panel">
  <div class="login-box">
    <h2 class="login-title">經銷商登入</h2>
    <p class="login-sub">請輸入您的帳號與密碼</p>

    <div class="alert" id="alertBar">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke="currentColor" stroke-width="1.2"/><line x1="7.5" y1="5" x2="7.5" y2="8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7.5" cy="10.5" r=".6" fill="currentColor"/></svg>
      <span id="alertText"></span>
    </div>

    <button class="btn-google" id="googleBtn" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      用 Google 帳號登入
    </button>

    <div class="divider">或使用帳號密碼</div>

    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>帳號</label>
        <input type="text" id="account" placeholder="請輸入帳號" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="password" placeholder="請輸入密碼" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text">登入</span>
      </button>
    </form>

    <div class="apply-link">尚未有帳號？<a onclick="openApply()">申請經銷商帳號</a></div>
    <div class="login-footer">帳號由管理員建立，如需協助請聯繫業務專員<br>© 2025 國際柑仔店 Mascot International</div>
  </div>
</div>

<!-- 申請帳號 Modal -->
<div class="modal-bg" id="applyModal">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title">申請經銷商帳號</span>
      <button class="modal-close" onclick="closeApply()">✕</button>
    </div>
    <div id="applyContent">
      <div class="modal-body">
        <p style="font-size:13px;color:var(--ink-3)">申請後由管理員審核，核准後即可用 Google 帳號登入。</p>
        <div class="fg"><label>Gmail 地址 *</label><input type="text" id="applyGmail" placeholder="your@gmail.com"></div>
        <div class="fg"><label>公司 / 商行名稱 *</label><input type="text" id="applyName" placeholder="XX 食品行"></div>
        <div class="fg"><label>申請原因（選填）</label><textarea id="applyReason" placeholder="簡述您的業務需求..."></textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn-cancel" onclick="closeApply()">取消</button>
        <button class="btn-primary" id="applyBtn" onclick="submitApply()">送出申請</button>
      </div>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzbrEhEC44y6mA-ThVDklFrvZs_HlagR4si8UgE7MRWtE_1GXSTU0Q-QiI7GxcFO4SfmA/exec';

// ── 版面配置 ──
const LAYOUTS = {
  A: { cols:'1.4fr 1fr', rows:'1fr 1fr', blocks:[{r:'1/3'},{r:''},{r:''}] },
  B: { cols:'1fr 1fr 1fr', rows:'1.3fr 1fr', blocks:[{c:'1/4'},{c:''},{c:''},{c:''}] },
  C: { cols:'1fr 1fr', rows:'1fr 1fr', blocks:[{},{},{},{}] },
  D: { cols:'1.4fr 1fr', rows:'1fr 1fr', blocks:[{r:'1/3'},{r:''},{r:''}] },
};

function applyLayout(cfg) {
  const panel = document.getElementById('brandPanel');
  const grid  = document.getElementById('blockGrid');
  const L     = LAYOUTS[cfg.layout] || LAYOUTS['A'];

  panel.className = 'brand-panel layout-' + cfg.layout;
  grid.style.gridTemplateColumns = L.cols;
  grid.style.gridTemplateRows    = L.rows;

  grid.innerHTML = L.blocks.map((b, i) => {
    const n     = i + 1;
    const img   = cfg['block' + n + '_img']   || '';
    const color = cfg['block' + n + '_color'] || '#2C1F16';
    const style = img
      ? 'background-image:url(' + JSON.stringify(img) + ');background-size:cover;background-position:center;'
      : 'background:' + color + ';';
    const span  = (b.r ? 'grid-row:' + b.r + ';' : '') + (b.c ? 'grid-column:' + b.c + ';' : '');
    return '<div class="block-img" style="' + span + style + '"></div>';
  }).join('');

  document.getElementById('taglineEl').textContent    = cfg.tagline    || '精選日系生活好物';
  document.getElementById('taglineSubEl').textContent = cfg.tagline_sub || '嚴選日本生活百貨，直送您的門市';
}

// ── 載入網站設定 ──
async function loadConfig() {
  try {
    const res  = await fetch(GAS_URL + '?action=getSiteConfig');
    const data = await res.json();
    if (data.success) applyLayout(data.config);
  } catch(e) {
    applyLayout({ layout:'A', tagline:'精選日系生活好物', tagline_sub:'嚴選日本生活百貨，直送您的門市' });
  }
}

// ── Google 登入 ──
async function doGoogleLogin() {
  const btn = document.getElementById('googleBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> 連接中...';
  try {
    const w = 500, h = 600;
    const l = (screen.width - w) / 2, t = (screen.height - h) / 2;
    const popup = window.open(
      GAS_URL + '?action=getGoogleUser',
      'gLogin', 'width=' + w + ',height=' + h + ',left=' + l + ',top=' + t
    );
    const gmail = await waitForPopup(popup);
    if (!gmail) throw new Error('Google 登入被取消');

    const url  = GAS_URL + '?action=loginWithGoogle&gmail=' + encodeURIComponent(gmail) + '&name=' + encodeURIComponent(gmail.split('@')[0]);
    const res  = await fetch(url);
    const data = await res.json();

    if (data.success) {
      handleLoginSuccess(data);
    } else {
      if (data.message && data.message.includes('申請')) {
        if (confirm(data.message + '\n\n是否立即申請帳號？')) {
          document.getElementById('applyGmail').value = gmail;
          openApply();
        }
      } else { showAlert(data.message || 'Google 登入失敗'); }
    }
  } catch(err) { showAlert('Google 登入失敗：' + err.message); }
  finally {
    btn.disabled = false;
    btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg> 用 Google 帳號登入';
  }
}

function waitForPopup(popup) {
  return new Promise(resolve => {
    const check = setInterval(() => {
      try {
        if (popup.closed) { clearInterval(check); resolve(null); return; }
        const url = popup.location.href;
        if (url.includes('gmail=')) {
          const gmail = decodeURIComponent(url.split('gmail=')[1].split('&')[0]);
          popup.close(); clearInterval(check); resolve(gmail);
        }
      } catch(e) {}
    }, 500);
    setTimeout(() => { clearInterval(check); if (!popup.closed) popup.close(); resolve(null); }, 120000);
  });
}

// ── 帳號密碼登入 ──
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const account  = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;
  document.getElementById('alertBar').classList.remove('show');
  btn.disabled = true; btn.classList.add('loading');
  try {
    const url  = GAS_URL + '?action=login&account=' + encodeURIComponent(account) + '&password=' + encodeURIComponent(password);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) { handleLoginSuccess(data); }
    else { showAlert(data.message || '帳號或密碼錯誤'); }
  } catch(err) { showAlert('連線失敗：' + err.message); }
  finally { btn.disabled = false; btn.classList.remove('loading'); }
}

function handleLoginSuccess(data) {
  const role = data.role || 'dealer';
  if (role === 'admin' || role === 'cmo') {
    sessionStorage.setItem('admin', JSON.stringify({ account:data.account, name:data.name, role, token:data.token }));
    window.location.href = 'admin/index.html';
  } else {
    sessionStorage.setItem('dealer', JSON.stringify({ account:data.account, name:data.name, role, token:data.token }));
    window.location.href = 'catalog.html';
  }
}

function showAlert(msg) {
  document.getElementById('alertText').textContent = msg;
  document.getElementById('alertBar').classList.add('show');
}

// ── 申請帳號 ──
function openApply()  { document.getElementById('applyModal').classList.add('open'); }
function closeApply() { document.getElementById('applyModal').classList.remove('open'); }

async function submitApply() {
  const gmail  = document.getElementById('applyGmail').value.trim();
  const name   = document.getElementById('applyName').value.trim();
  const reason = document.getElementById('applyReason').value.trim();
  if (!gmail) { alert('請填寫 Gmail 地址'); return; }
  if (!name)  { alert('請填寫公司名稱'); return; }
  const btn = document.getElementById('applyBtn');
  btn.disabled = true; btn.textContent = '送出中...';
  try {
    const url  = GAS_URL + '?action=applyAccount&gmail=' + encodeURIComponent(gmail) + '&name=' + encodeURIComponent(name) + '&reason=' + encodeURIComponent(reason);
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      document.getElementById('applyContent').innerHTML = '<div class="success-msg"><p style="font-size:28px">✓</p><p style="margin-top:12px">' + data.message + '</p></div>';
    } else { alert(data.message || '送出失敗'); btn.disabled = false; btn.textContent = '送出申請'; }
  } catch(err) { alert('連線失敗'); btn.disabled = false; btn.textContent = '送出申請'; }
}

// ── 初始化 ──
const saved = sessionStorage.getItem('dealer') || sessionStorage.getItem('admin');
if (saved) {
  const d = JSON.parse(saved);
  if (d.role === 'admin' || d.role === 'cmo') window.location.href = 'admin/index.html';
  else window.location.href = 'catalog.html';
} else {
  loadConfig();
}
</script>
</body>
</html>
